[package]
name = "sync-sse-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures = "=0.3.34"

[profile.release]
opt-level = 3
