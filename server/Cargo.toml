[package]
name = "folia-server"
version = "0.2.0"
edition = "2021"
description = "Folia, the web server of Betula: fetches snapshots from Radix, renders the app, serves the snapshot to browsers"

[[bin]]
name = "folia"
path = "src/main.rs"

[dependencies]
folia-app = { path = "../app", features = ["ssr"] }
folia-catalog = { path = "../catalog", features = ["native"] }
leptos = { version = "0.8.20", features = ["ssr"] }
leptos_axum = "0.8"
axum = { version = "0.8", features = ["tokio", "http1", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
# The snapshot endpoint is plain HTTP inside the deployment's network; no TLS stack to build.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
# Link-preview cards (src/cards.rs): SVG to PNG in this process, with our own font files only.
resvg = { version = "0.45", default-features = false, features = ["text"] }
# The shaper resvg sets text with, used directly to measure lines before they are set.
rustybuzz = "0.20"
# The cards are written as palette PNGs (a fifth of the size of tiny-skia's true-colour ones).
png = "0.17"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
