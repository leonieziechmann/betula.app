[package]
name = "btu-client"
version = "0.1.0"
edition = "2021"
description = "The browser app of the BTU catalog (WASM): the app's components on the local sql.js database"

[lib]
crate-type = ["cdylib"]

[dependencies]
btu-app = { path = "../app", features = ["csr"] }
btu-catalog = { path = "../catalog" }
leptos = { version = "0.8.20", features = ["csr"] }
# Must be the version of the wasm-bindgen CLI that scripts/build-client.sh runs.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "Element"] }
console_error_panic_hook = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
