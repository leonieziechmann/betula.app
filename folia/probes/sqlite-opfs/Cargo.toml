[package]
name = "folia-probe-sqlite-opfs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Probe of the data worker's step 2: rusqlite on sqlite-wasm-rs in a Web Worker, the snapshot in the Origin Private File System"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rusqlite = "0.40"
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = "0.2"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
