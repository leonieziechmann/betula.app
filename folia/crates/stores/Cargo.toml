[package]
name = "folia-stores"
version = "1.0.3"
edition = "2021"
description = "What a visitor of Betula keeps in the browser: marked modules, the Studienplan, Mein Studiengang"

[lib]
name = "folia_stores"

[features]
ssr = ["leptos/ssr", "leptos_router/ssr", "folia-design/ssr", "folia-data/ssr", "folia-shell/ssr"]
csr = ["leptos/csr", "dep:web-sys", "dep:wasm-bindgen", "folia-design/csr", "folia-shell/csr"]

[dependencies]
leptos = "0.8.20"
leptos_router = "0.8"
folia-design = { path = "../design" }
folia-data = { path = "../data" }
folia-shell = { path = "../shell" }
folia-calendar = { path = "../calendar" }
folia-model = { path = "../model" }
folia-pack = { path = "../pack" }
folia-pages = { path = "../pages" }
folia-plans = { path = "../plans" }
folia-routes = { path = "../routes" }
folia-timetable = { path = "../timetable" }
folia-locale = { path = "../locale" }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Location", "MediaQueryList", "Event", "EventTarget", "Element", "Node", "NodeList", "DomRect", "HtmlElement", "HtmlInputElement", "FocusOptions", "DomTokenList", "Storage", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ResizeObserver", "ScrollToOptions", "ScrollBehavior", "MouseEvent", "HtmlAnchorElement", "Url", "Performance", "History", "PopStateEvent", "PopStateEventInit", "Blob", "BlobPropertyBag", "AddEventListenerOptions"] }

[dev-dependencies]
# The tests that look a program up in a real snapshot (`FOLIA_TEST_SNAPSHOT`).
folia-model = { path = "../model", features = ["sqlite"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
