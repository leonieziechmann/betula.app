[package]
name = "folia-shell"
version = "1.0.3"
edition = "2021"
description = "The shell of Betula's app: the frame of a page, the areas, a step between pages, the ground, the document"

[lib]
name = "folia_shell"

[features]
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr", "folia-design/ssr", "folia-data/ssr", "folia-stores/ssr"]
csr = ["leptos/csr", "dep:web-sys", "dep:wasm-bindgen", "folia-design/csr", "folia-stores/csr"]

[dependencies]
leptos = "0.8.20"
leptos_router = "0.8"
leptos_meta = "0.8"
folia-design = { path = "../design" }
folia-data = { path = "../data" }
# The chrome shows how many modules are marked and planned.
folia-stores = { path = "../stores" }
folia-calendar = { path = "../calendar" }
folia-pages = { path = "../pages" }
folia-routes = { path = "../routes" }
serde = { version = "1.0", features = ["derive"] }
# Structured data for search engines (`seo`).
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
send_wrapper = "0.6"
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Location", "MediaQueryList", "Event", "EventTarget", "Element", "Node", "NodeList", "DomRect", "HtmlElement", "HtmlInputElement", "FocusOptions", "DomTokenList", "Storage", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ResizeObserver", "ScrollToOptions", "ScrollBehavior", "MouseEvent", "HtmlAnchorElement", "Url", "Performance", "History", "PopStateEvent", "PopStateEventInit", "Blob", "BlobPropertyBag", "AddEventListenerOptions"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
