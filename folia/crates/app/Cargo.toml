[package]
name = "folia-app"
version = "1.0.3"
edition = "2021"
description = "The web app of Betula: Leptos components, rendered on the server and again in the browser"

[lib]
name = "folia_app"

[features]
# Server rendering (the web server) and the browser app (the WASM bundle) are the two builds of this crate.
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr", "dep:leptos_axum", "dep:http", "folia-design/ssr", "folia-data/ssr"]
# The browser app renders fresh from the local database instead of hydrating server HTML.
csr = ["leptos/csr", "dep:web-sys", "dep:wasm-bindgen", "folia-design/csr"]

[dependencies]
leptos = "0.8.20"
leptos_router = "0.8"
leptos_meta = "0.8"
# The design: building blocks, formats, the languages (docs/folia/folia-refactor.md §7.4).
folia-design = { path = "../design" }
# Where a page asks for its data.
folia-data = { path = "../data" }
# The domain: what the pages show and how they load it (folia/crates/<crate>, docs/folia/folia-refactor.md §7).
folia-calendar = { path = "../calendar" }
folia-locale = { path = "../locale" }
folia-model = { path = "../model" }
folia-pages = { path = "../pages" }
folia-plans = { path = "../plans" }
folia-query = { path = "../query" }
folia-routes = { path = "../routes" }
folia-search = { path = "../search" }
folia-timetable = { path = "../timetable" }
# The marked modules on their way to another device, as a code in the fragment of a link.
folia-pack = { path = "../pack" }
serde = { version = "1.0", features = ["derive"] }
# Structured data for search engines (`seo`). Already part of every build through leptos.
serde_json = "1.0"
leptos_axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# JavaScript handles (a ResizeObserver) kept until a component is cleaned up: cleanups are `Send`.
send_wrapper = "0.6"
# `Blob`, `BlobPropertyBag`: the Studienplan's .ics download is a Blob URL, made before the click.
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Location", "MediaQueryList", "Event", "EventTarget", "Element", "Node", "NodeList", "DomRect", "HtmlElement", "HtmlInputElement", "FocusOptions", "DomTokenList", "Storage", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ResizeObserver", "ScrollToOptions", "ScrollBehavior", "MouseEvent", "HtmlAnchorElement", "Url", "Performance", "History", "PopStateEvent", "PopStateEventInit", "Blob", "BlobPropertyBag", "AddEventListenerOptions"] }

[dev-dependencies]
# The tests that look a program up in a real snapshot (`FOLIA_TEST_SNAPSHOT`), as the domain's do.
folia-model = { path = "../model", features = ["sqlite"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
