[package]
name = "folia-test-support"
version = "0.1.0"
edition = "2021"
description = "What the tests of Folia's crates share: the snapshot, the pinned one, direct SQL"

[dependencies]
folia-model = { path = "../model", features = ["sqlite"] }
# A pinned snapshot of an older schema is read as Radix's later migrations leave it (`migrated`).
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# The layers test reads `cargo metadata`.
serde_json = "1.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
