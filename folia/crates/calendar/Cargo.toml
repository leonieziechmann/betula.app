[package]
name = "folia-calendar"
version = "0.1.0"
edition = "2021"
description = "Days, semesters, kinds of events, a plan's selection, the codes of shared plans and subscriptions"

[dependencies]
folia-locale = { path = "../locale" }
folia-model = { path = "../model" }
folia-pack = { path = "../pack" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
folia-test-support = { path = "../test-support" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
