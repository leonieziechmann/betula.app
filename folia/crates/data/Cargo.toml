[package]
name = "folia-data"
version = "1.0.3"
edition = "2021"
description = "Where the pages of Betula's app ask for their data: on the server's thread or from the data worker"

[lib]
name = "folia_data"

[features]
# The web server: a page sets the status of its response (`PageStatus`).
ssr = ["leptos/ssr", "dep:leptos_axum", "dep:http"]

[dependencies]
leptos = "0.8.20"
folia-model = { path = "../model" }
folia-pages = { path = "../pages" }
serde_json = "1.0"
leptos_axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
