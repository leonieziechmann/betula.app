# The two images of the application (flake.nix: radix-image, folia-image), built for every push
# to master that changes what they are built from - exactly as deploy/ship.sh builds them: the
# same sources (git archive of BUILD_PATHS), the same "path:" flake, the same release tag
# <date>-<short hash>. The result is ONE artifact, betula-images-<tag>.tar, kept for a week:
#
#   release.json          tag, commits, run, and the sha256 of both image files
#   radix-image.tar.gz    docker archives as "nix build" leaves them, for "docker load"
#   folia-image.tar.gz
#
# Nothing here reaches the server, and no secret is used. The server fetches the artifact itself
# (deploy/vps/canary-agent.sh, deploy/README.md section 12) with a token that can only read this
# repository's workflow runs; only runs of THIS file, started by a push to master, count there.
#
# The repository is public: this file, its logs and its artifacts can be read by everybody, so
# none of them may ever hold a secret (none does: the job asks for nothing but reading the code).
# Pull requests and forks cannot start it - only a push to master does.
#
# Actions are pinned to the commit of a release (the comment names it). Updating one: look the
# tag up (git ls-remote --tags https://github.com/<owner>/<action>), read the release notes,
# replace the hash and the comment.
name: images

on:
  push:
    # TEMPORARY: this branch as well, for one real build before the merge. Removed again right after.
    branches: [master, claude/github-canary-pipeline-gvjuew]
    # What the images are built from: BUILD_PATHS in deploy/ship.sh (the first step of the job
    # checks that every one of them is listed here), and this file. A push that changes nothing
    # of it (docs, deploy/) is no new release, as for ship.sh.
    paths:
      - .github/workflows/images.yml
      - flake.nix
      - flake.lock
      - Cargo.toml
      - Cargo.lock
      - go.mod
      - go.sum
      - app/**
      - catalog/**
      - client/**
      - pack/**
      - server/**
      - cmd/**
      - internal/**

# Nothing by default; the job asks for what it needs.
permissions: {}

# One build at a time per branch. A push while one runs waits, and of several that wait only the
# newest runs (GitHub replaces the pending run of a group): every build that finishes can reach
# canary. No cancel-in-progress: with a merge every quarter of an hour it would cancel every build
# before it is done.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: radix-image and folia-image
    runs-on: ubuntu-24.04
    # A build without anything cached: Go with its tests, wasm-bindgen, the web server and the
    # browser app (fat LTO), on the standard runner of a public repository (4 processors, 16 GB;
    # its minutes cost nothing).
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag names the last commit that changed the sources: that needs the history.
          fetch-depth: 0
          # Nothing after this step talks to GitHub with the token.
          persist-credentials: false

      - name: Release tag
        id: release
        run: |
          set -Eeuo pipefail
          # The list and the tag of deploy/ship.sh, read from there, so the two cannot drift.
          line="$(grep -E '^BUILD_PATHS=\(.*\)$' deploy/ship.sh)"
          read -r -a paths <<<"$(sed -E 's/^BUILD_PATHS=\((.*)\)$/\1/' <<<"${line}")"
          [[ "${#paths[@]}" -gt 0 ]] || { echo "::error::no BUILD_PATHS in deploy/ship.sh"; exit 1; }
          for path in "${paths[@]}"; do
            grep -qxF -e "      - ${path}" -e "      - ${path}/**" .github/workflows/images.yml ||
              { echo "::error::${path} is in BUILD_PATHS (deploy/ship.sh) but not under on.push.paths of this workflow"; exit 1; }
          done
          commit="$(git log -1 --format=%h --abbrev=7 HEAD -- "${paths[@]}")"
          # The date in the commit's own time zone ("format:", not "format-local:"): the same on
          # the workstation and here.
          day="$(git log -1 --format=%cd --date=format:%Y-%m-%d HEAD -- "${paths[@]}")"
          tag="${day}-${commit}"
          [[ "${tag}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}$ ]] || { echo "::error::'${tag}' is not a release tag"; exit 1; }
          {
            echo "tag=${tag}"
            echo "build_commit=$(git log -1 --format=%H HEAD -- "${paths[@]}")"
            echo "paths=${paths[*]}"
          } >>"${GITHUB_OUTPUT}"
          echo "release ${tag}"

      - name: Make room
        run: |
          # A Rust build in the Nix sandbox needs more than the free space the runner starts with.
          # These preinstalled toolchains are not used here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -n 1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = false

      - name: Build
        env:
          PATHS: ${{ steps.release.outputs.paths }}
        run: |
          set -Eeuo pipefail
          read -r -a paths <<<"${PATHS}"
          src="${RUNNER_TEMP}/src"
          out="${RUNNER_TEMP}/images"
          mkdir -p "${src}" "${out}"
          # As deploy/ship.sh: the commit, not the checkout, byte for byte (LF), built as a
          # "path:" flake. So a release is the same derivation here and on the workstation.
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar HEAD -- "${paths[@]}" | tar -xf - -C "${src}"
          nix build "path:${src}#radix-image" "path:${src}#folia-image" --out-link "${RUNNER_TEMP}/result" --print-build-logs
          cp -L "${RUNNER_TEMP}/result" "${out}/radix-image.tar.gz"
          cp -L "${RUNNER_TEMP}/result-1" "${out}/folia-image.tar.gz"
          ls -l "${out}"
          df -h / | tail -n 1

      - name: Smoke test
        run: |
          set -Eeuo pipefail
          out="${RUNNER_TEMP}/images"
          for image in radix folia; do
            loaded="$(docker load -i "${out}/${image}-image.tar.gz")"
            echo "${loaded}"
            # The name deploy/ship.sh and the server expect; they give it the release tag.
            grep -qxF "Loaded image: betula-${image}:latest" <<<"${loaded}" ||
              { echo "::error::${image}-image.tar.gz does not hold betula-${image}:latest"; exit 1; }
          done
          docker run --rm --network none --cap-drop ALL betula-radix:latest help >/dev/null
          # The web server starts without a snapshot (/livez 200, /healthz 503) and has no shell:
          # its own healthcheck asks /livez from inside, as the stack's health check does.
          cid="$(docker run -d --network none --cap-drop ALL --read-only --tmpfs /tmp -e FOLIA_ACCESS_GATE=off betula-folia:latest)"
          alive=0
          for _ in $(seq 1 60); do
            if docker exec "${cid}" /bin/folia healthcheck; then
              alive=1
              break
            fi
            sleep 1
          done
          docker logs --tail 20 "${cid}" 2>&1
          docker rm -f "${cid}" >/dev/null
          [[ "${alive}" == "1" ]] || { echo "::error::the web server did not answer /livez within a minute"; exit 1; }

      - name: Pack
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BUILD_COMMIT: ${{ steps.release.outputs.build_commit }}
        run: |
          set -Eeuo pipefail
          cd "${RUNNER_TEMP}/images"
          sha() { sha256sum "$1" | cut -d ' ' -f 1; }
          jq -n \
            --arg tag "${TAG}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg build_commit "${BUILD_COMMIT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg radix "$(sha radix-image.tar.gz)" \
            --arg folia "$(sha folia-image.tar.gz)" \
            '{tag: $tag, repository: $repository, commit: $commit, build_commit: $build_commit,
              run_id: ($run_id | tonumber), run_attempt: ($run_attempt | tonumber),
              images: {radix: {file: "radix-image.tar.gz", sha256: $radix},
                       folia: {file: "folia-image.tar.gz", sha256: $folia}}}' >release.json
          cat release.json
          # Uncompressed: the image files are gzip already. Owner and modes fixed, so the file
          # says nothing about this runner.
          tar --owner=0 --group=0 --numeric-owner --mode=0644 -cf "${RUNNER_TEMP}/betula-images-${TAG}.tar" \
            release.json radix-image.tar.gz folia-image.tar.gz
          {
            echo "### Release ${TAG}"
            echo
            echo "| image | bytes | sha256 |"
            echo "|---|---|---|"
            for image in radix folia; do
              echo "| betula-${image}:${TAG} | $(stat -c %s "${image}-image.tar.gz") | \`$(sha "${image}-image.tar.gz")\` |"
            done
            echo
            echo "Artifact \`betula-images-${TAG}.tar\` (kept for a week). The server fetches it by itself (deploy/README.md section 12)."
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # archive: false uploads the file as it is, under its own name: no zip for the server
          # to unpack, and the digest GitHub keeps is the sha256 of exactly this file.
          path: ${{ runner.temp }}/betula-images-${{ steps.release.outputs.tag }}.tar
          archive: false
          # The server picks a build up within minutes; a week covers a server that was away and
          # a release fetched by hand. A public repository pays nothing for the storage.
          retention-days: 7
          if-no-files-found: error
