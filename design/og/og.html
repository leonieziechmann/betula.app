<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Betula: picture for link previews (Open Graph)</title>
<style>
/* 1200 × 630. Render it to app/assets/og.png:
   node e2e/shot.mjs file:///<repo>/design/og/og.html app/assets/og.png 1200 630
   The dots are a cut of the program map (catalog::graph), drawn by hand into this file: the
   picture says "programs and how they hang together", it is not data. */
@font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; src: url("../../app/assets/inter-latin.woff2") format("woff2"), local("Inter"); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; }
body { background: #f1f2f4; color: #10151f; font: 450 28px/1.35 "Inter", system-ui, sans-serif; letter-spacing: -.012em; -webkit-font-smoothing: antialiased; position: relative; overflow: hidden; }
.card { position: absolute; inset: 40px; border-radius: 22px; background: #fff; box-shadow: 0 0 0 1px rgba(15, 23, 42, .08), 0 30px 60px -30px rgba(15, 23, 42, .25); overflow: hidden; }
.text { position: absolute; left: 64px; top: 60px; width: 640px; }
.lockup { display: flex; align-items: center; gap: 22px; }
.mark { display: block; flex: none; }
.wordmark { display: inline-block; font: 800 64px/1 "Inter", sans-serif; letter-spacing: -.01em; white-space: nowrap; }
.wordmark .sc { font-size: .72em; font-weight: 400; letter-spacing: .02em; }
.wordmark .e { margin: 0 -.347em 0 -.022em; }
.wordmark .u { margin-left: -.03em; }
.wordmark .la { margin-left: -.055em; }
h1 { margin: 64px 0 0; font-size: 50px; line-height: 1.12; font-weight: 720; letter-spacing: -.035em; text-wrap: balance; }
p { margin: 22px 0 0; color: #4b5565; font-size: 27px; }
.foot { position: absolute; left: 64px; bottom: 50px; display: flex; gap: 12px; align-items: center; font-size: 22px; font-weight: 560; color: #4b5565; }
.foot b { color: #10151f; font-weight: 680; }
.foot i { width: 5px; height: 5px; border-radius: 50%; background: #8790a0; }
svg.map { position: absolute; right: -40px; top: 0; width: 520px; height: 550px; }
.map line { stroke: #10151f; stroke-opacity: .28; stroke-width: 1.6; }
.map .b { fill: #10151f; stroke: #10151f; stroke-width: 2.4; }
.map .m { fill: #fff; stroke: #10151f; stroke-width: 2.4; }
.map .o { fill: #8790a0; stroke: #8790a0; stroke-width: 2.4; }
</style>
</head>
<body>
<div class="card">
  <svg class="map" viewBox="0 0 520 550" aria-hidden="true">
    <line x1="96" y1="120" x2="170" y2="92"/><line x1="170" y1="92" x2="236" y2="130"/><line x1="236" y1="130" x2="212" y2="204"/>
    <line x1="96" y1="120" x2="132" y2="196"/><line x1="132" y1="196" x2="212" y2="204"/><line x1="212" y1="204" x2="286" y2="246"/>
    <line x1="286" y1="246" x2="372" y2="214"/><line x1="372" y1="214" x2="438" y2="158"/><line x1="372" y1="214" x2="420" y2="282"/>
    <line x1="286" y1="246" x2="262" y2="330"/><line x1="262" y1="330" x2="180" y2="362"/><line x1="180" y1="362" x2="118" y2="318"/>
    <line x1="262" y1="330" x2="334" y2="384"/><line x1="334" y1="384" x2="416" y2="372"/><line x1="334" y1="384" x2="318" y2="462"/>
    <line x1="318" y1="462" x2="236" y2="484"/><line x1="236" y1="484" x2="180" y2="362"/><line x1="416" y1="372" x2="420" y2="282"/>
    <line x1="438" y1="158" x2="392" y2="84"/><line x1="318" y1="462" x2="404" y2="486"/>
    <circle class="b" cx="96" cy="120" r="15"/><circle class="m" cx="170" cy="92" r="12"/><circle class="b" cx="236" cy="130" r="18"/>
    <circle class="m" cx="132" cy="196" r="10"/><circle class="b" cx="212" cy="204" r="21"/><circle class="m" cx="286" cy="246" r="16"/>
    <circle class="b" cx="372" cy="214" r="19"/><circle class="m" cx="438" cy="158" r="12"/><circle class="o" cx="420" cy="282" r="9"/>
    <circle class="b" cx="262" cy="330" r="17"/><circle class="m" cx="180" cy="362" r="14"/><circle class="b" cx="118" cy="318" r="10"/>
    <circle class="b" cx="334" cy="384" r="20"/><circle class="m" cx="416" cy="372" r="13"/><circle class="m" cx="318" cy="462" r="15"/>
    <circle class="b" cx="236" cy="484" r="12"/><circle class="b" cx="392" cy="84" r="9"/><circle class="o" cx="404" cy="486" r="10"/>
  </svg>
  <div class="text">
    <div class="lockup">
      <!-- The mark, as design/logo/icon.svg (node design/logo/render-icons.mjs writes it). -->
      <svg class="mark" width="76" height="76" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6dac78"/><stop offset="1" stop-color="#2d6945"/></linearGradient></defs><rect width="96" height="96" rx="21" fill="url(#g)"/><path d="M48 65.9Q48.8 72.6 45.5 78.2" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M48 14.7C49.6 23.6 59.9 37 67.6 49.2C71.7 55.3 71.5 60.4 67.6 63.1C61.7 65.9 53.9 67 48 68.2C42.1 67 34.3 65.9 28.4 63.1C24.5 60.4 24.3 55.3 28.4 49.2C36.1 37 46.4 23.6 48 14.7Z" fill="#fff"/><path d="M48.9 31.3H40.12C39.15 32.85 38.13 34.42 37.08 36H48.9ZM50.4 40.2H61.7C62.75 41.77 63.8 43.34 64.82 44.9H50.4ZM38.8 49.1H28.46C28.44 49.13 28.42 49.17 28.4 49.2C27.32 50.81 26.53 52.35 26.04 53.8H38.8ZM42.7 58H70.57C70.42 59.9 69.59 61.5 68.13 62.7H42.7Z" fill="#10151f"/></svg>
      <span class="wordmark"><span>B</span><span class="sc e">E</span><span>T</span><span class="u">U</span><span class="sc la">LA</span></span>
    </div>
    <h1>Alle Module und Studiengänge der BTU Cottbus-Senftenberg.</h1>
    <p>Durchsuchen, filtern, Studium planen.</p>
  </div>
  <div class="foot"><b>betula.app</b><i></i><span>Modulkatalog</span><i></i><span>inoffiziell</span></div>
</div>
</body>
</html>
