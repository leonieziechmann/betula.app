[workspace]
members = [
    "app",
    "catalog",
    "client",
    "pack",
    "server",
]
# `client` is the WASM build of the app (feature csr); building it together with the server
# (feature ssr) would unify both into one leptos. Build it with scripts/build-client.sh.
default-members = ["app", "catalog", "pack", "server"]
resolver = "2"

# Leptos view types make full debug info enormous (a 1.8 GB server binary).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Drawing the link-preview cards (server/src/cards.rs) is pixel work: unoptimised it takes a
# third of a second per card, which would make the dev server turn previews away as "busy".
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

# Brotli at its best quality (server/build/main.rs: the assets; server/src/snapshot.rs: the
# catalog) is a second of work optimised and a minute without: the build script and the tests run
# it too, and its checks of every sum in dev cost four times over. Build scripts are built
# unoptimised even in release, so both profiles say it.
[profile.dev.package.brotli]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.brotli-decompressor]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.release.package.brotli]
opt-level = 3

[profile.release]
lto = "thin"

# The browser app while working on it: built in seconds, not in minutes. Everything
# `wasm-release` does for size (opt-level "z", fat LTO, a single codegen unit) is slow and
# none of it helps while iterating. `scripts/build-client.sh --dev` builds with this one.
[profile.wasm-dev]
inherits = "dev"
# Not 0: unoptimised the bundle is 39 MB (155 MB once wasm-bindgen has run), which the browser
# then has to parse on every reload. opt-level 1 costs a second per rebuild and keeps it at 12 MB.
opt-level = 1
# Localhost only, and the Rust names stay in the WASM anyway: debug info would just add weight.
debug = false

# The WASM bundle of the browser app: size first.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
