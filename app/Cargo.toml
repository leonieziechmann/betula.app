[package]
name = "folia-app"
version = "0.2.1"
edition = "2021"
description = "The web app of Betula: Leptos components, rendered on the server and again in the browser"

[lib]
name = "app"

[features]
# Server rendering (the web server) and the browser app (the WASM bundle) are the two builds of this crate.
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr", "dep:leptos_axum", "dep:http"]
# The browser app renders fresh from the local database instead of hydrating server HTML.
csr = ["leptos/csr", "dep:web-sys", "dep:wasm-bindgen"]

[dependencies]
leptos = "0.8.20"
leptos_router = "0.8"
leptos_meta = "0.8"
folia-catalog = { path = "../catalog" }
serde = { version = "1.0", features = ["derive"] }
# Structured data for search engines (`seo`). Already part of every build through leptos.
serde_json = "1.0"
leptos_axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# JavaScript handles (a ResizeObserver) kept until a component is cleaned up: cleanups are `Send`.
send_wrapper = "0.6"
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Location", "MediaQueryList", "Event", "EventTarget", "Element", "Node", "NodeList", "DomRect", "HtmlElement", "HtmlInputElement", "FocusOptions", "DomTokenList", "Storage", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ResizeObserver", "ScrollToOptions", "ScrollBehavior"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
