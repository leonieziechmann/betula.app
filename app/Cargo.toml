[package]
name = "btu-app"
version = "0.1.0"
edition = "2021"
description = "The BTU catalog web app: Leptos components rendered on the server and hydrated in the browser"

[lib]
name = "app"

[features]
# Server rendering (the web server) and the browser app (the WASM bundle) are the two builds of this crate.
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr", "dep:leptos_axum", "dep:http"]
# The browser app renders fresh from the local database instead of hydrating server HTML.
csr = ["leptos/csr", "dep:web-sys", "dep:wasm-bindgen"]

[dependencies]
leptos = "0.8.20"
leptos_router = "0.8"
leptos_meta = "0.8"
btu-catalog = { path = "../catalog" }
serde = { version = "1.0", features = ["derive"] }
leptos_axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "MediaQueryList", "Event", "EventTarget", "Element", "Node", "NodeList", "DomRect", "HtmlFormElement", "FormData", "UrlSearchParams"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
