<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTU Smart Modulkatalog</title>
  <meta name="description" content="Intelligenter Modulkatalog und Studienplaner der BTU Cottbus-Senftenberg">
  <meta name="theme-color" content="#003b5c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BTU Katalog">
  <link rel="icon" type="image/svg+xml" href="/static/icon-192.svg">
  <link rel="apple-touch-icon" href="/static/icon-192.svg">

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="/manifest.json">
  <link data-trunk rel="copy-file" href="static/manifest.json">
  <link data-trunk rel="copy-file" href="static/sw.js">

  <!-- Original BTU Stylesheet -->
  <link data-trunk rel="css" href="static/app.css">

  <!-- Trunk Rust WebAssembly -->
  <link data-trunk rel="rust" data-wasm-opt="z" data-integrity="none" />
  <link data-trunk rel="copy-dir" href="static" />

  <!-- SQL.js WebAssembly Engine & Bridge -->
  <script src="/static/sql-wasm.js"></script>
  <script src="/static/sqlite_bridge.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] Service Worker active, scope:', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
