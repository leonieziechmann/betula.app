# Installed by /opt/betula/vps/20-ssh-lockdown.sh as /etc/ssh/sshd_config.d/01-betula-penalties.conf,
# only when this sshd knows the keyword (OpenSSH >= 9.8; Ubuntu 24.04 ships 9.6 and skips it).
#
# sshd's own short-term rate limiter; it replaces "ufw limit", which would also throttle the
# operator's automation (many short, successful sessions are never penalised here). fail2ban adds
# the long bans. Close to the upstream defaults: failed authentication costs 10 s instead of 5 s,
# and the ceiling is 30 min instead of 10 min. Nothing is refused until a source has collected
# 15 s of penalties. Only sub-options that already existed in 9.8 are used.
# Note for automation: a TCP probe of port 22 that never authenticates counts as "noauth" (1 s).
PerSourcePenalties crash:90s authfail:10s noauth:1s grace-exceeded:20s max:30m min:15s
