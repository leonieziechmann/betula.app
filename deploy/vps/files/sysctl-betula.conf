# Installed by /opt/betula/vps/10-base.sh as /etc/sysctl.d/99-zz-betula.conf.
# The name sorts after 99-sysctl.conf (the link to /etc/sysctl.conf, where provider images like
# to put their own settings), so these values win. 90-verify-host.sh reads this same file and
# compares every line with the running kernel. A leading "-" means: ignore the key if it does
# not exist (IPv6 switched off by the provider).
#
# Everything here was chosen to be compatible with Docker Swarm. Deliberately NOT set, because
# the usual hardening guides break container networking with them:
#   net.ipv4.ip_forward = 0            containers could not reach anything
#   net.ipv4.conf.*.rp_filter = 1      see below
#   net.bridge.bridge-nf-call-* = 0    Docker's per-bridge rules would stop matching
#   net.ipv4.conf.*.arp_ignore/arp_announce   interferes with the swarm load balancer (IPVS)
#   net.ipv6.conf.all.forwarding       turning it on makes the host ignore router advertisements
#   net.ipv4.conf.*.log_martians = 1   floods the journal on a Docker host; ufw resets it to 0 anyway

# ---- routing
# Docker needs forwarding and would switch it on itself at start-up. Stating it here keeps a later
# "sysctl --system" (package scripts run it) from ever switching it off under running containers.
# It is safe because ufw sets the FORWARD policy to DROP before this file is first applied, and
# betula-docker-firewall asserts that policy again before every dockerd start.
net.ipv4.ip_forward = 1

# Loose reverse-path filtering (Ubuntu's own default). Strict mode (1) drops legitimate packets
# on hosts where a container sits on several networks (docker_gwbridge + overlays + ingress):
# the reply route is not always the interface the packet came in on. New network namespaces copy
# these values, so they also apply inside the containers. The kernel uses max(all, interface).
# ufw loads /etc/ufw/sysctl.conf at the end of every start (boot, reload) and its packaged
# version says 1 for both keys; 10-base.sh rewrites those two lines to 2 and 90-verify-host.sh
# checks them, otherwise this decision would last exactly until the next reboot.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# ---- redirects and source routing: a single-homed server has no use for either
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
# A host with forwarding on would otherwise send redirects like a router.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
-net.ipv6.conf.all.accept_redirects = 0
-net.ipv6.conf.default.accept_redirects = 0
-net.ipv6.conf.all.accept_source_route = 0
-net.ipv6.conf.default.accept_source_route = 0

# ---- ICMP and TCP robustness
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
# Drop RST for sockets in TIME-WAIT (RFC 1337).
net.ipv4.tcp_rfc1337 = 1

# ---- kernel information leaks
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
# Only a parent may ptrace its children; docker exec and debuggers inside containers still work.
-kernel.yama.ptrace_scope = 1

# ---- availability
# Nobody watches the console: reboot 60 s after a kernel panic instead of staying dead.
kernel.panic = 60
# Swap is the safety net against the OOM killer and not working memory (5.9 GB RAM).
vm.swappiness = 10
