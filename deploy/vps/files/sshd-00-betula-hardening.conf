# Installed by /opt/betula/vps/20-ssh-lockdown.sh as /etc/ssh/sshd_config.d/00-betula-hardening.conf.
# Do not edit on the server; change deploy/vps/files/ and re-run the script (it validates and
# rolls back on its own).
#
# sshd keeps the FIRST value it reads for a keyword. sshd_config includes sshd_config.d/*.conf at
# its top (before any directive) in lexical order, so 00-* is read before 50-cloud-init.conf
# ("PasswordAuthentication yes" on this server; cloud-init owns that file and may rewrite it
# because the provider sets ssh_pwauth: 1), before 60-cloudimg-settings.conf and before
# everything in sshd_config itself. Nothing cloud-init writes later can win against this file.
#
# No Ciphers / KexAlgorithms / MACs / HostKeyAlgorithms on purpose: the OpenSSH 10 defaults are
# good (post-quantum key exchange included) and a typo in such a list locks everybody out.
# No Port either: Ubuntu listens through ssh.socket; the port stays 22.

# ---- who may log in, and how
PermitRootLogin no
AllowUsers deploy
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no

# ---- unauthenticated connections
# 3 tries: an agent holding more keys than that needs "IdentitiesOnly yes" next to the
# IdentityFile of the client's host alias, or the right key is never even offered.
# (20-ssh-lockdown.sh arms an automatic rollback until a fresh login has confirmed this.)
MaxAuthTries 3
LoginGraceTime 30

# ---- forwarding: only what one administrator realistically needs
# local (ssh -L) stays: it is how Grafana, Prometheus or the scraper's /status are reached
# without publishing them. Remote forwarding (-R) would let a stolen session open listeners on
# the server; nobody needs it. "docker -H ssh://" / docker contexts use no forwarding at all
# (they exec "docker system dial-stdio"), so Unix-socket forwarding can be off as well.
AllowTcpForwarding local
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
AllowAgentForwarding no
X11Forwarding no
PermitUserEnvironment no

# ---- housekeeping
# Reap sessions whose client vanished (laptop lid, NAT timeout) after about 10 minutes.
ClientAliveInterval 300
ClientAliveCountMax 2
# VERBOSE records the fingerprint of the key that logged in: the audit trail for a shared account.
LogLevel VERBOSE
