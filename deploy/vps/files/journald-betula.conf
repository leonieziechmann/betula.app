# Installed by /opt/betula/vps/10-base.sh as /etc/systemd/journald.conf.d/50-betula.conf.

[Journal]
# On disk (/var/log/journal), so logs survive the automatic reboots and Grafana Alloy can read
# the journal through a read-only bind mount.
Storage=persistent

# The default cap is 10 % of the file system (up to 4 GB). The long-term copy lives in Loki
# (30 days), so a fixed, small cap is enough although the disk (387 GB) would allow more.
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
# By age as well: nothing stays longer than 7 days. Traefik's access log, with the addresses of
# the site's visitors, is written here (stacks/edge.yml, "logging"), and the privacy notice names
# those 7 days (folia/crates/app/src/pages/legal.rs, „Zugriffsprotokoll"): change them together. journald
# deletes a whole file once its oldest entry is older than MaxRetentionSec, which it checks when
# it starts the next file; a file takes at most MaxFileSec of entries, so 6 + 1 days bound every
# entry at 7 days.
MaxRetentionSec=6day
MaxFileSec=1day
Compress=yes
