# Installed by /opt/betula/vps/10-base.sh as /etc/systemd/journald.conf.d/50-betula.conf.

[Journal]
# On disk (/var/log/journal), so logs survive the automatic reboots and Grafana Alloy can read
# the journal through a read-only bind mount.
Storage=persistent

# By age: nothing stays longer than 7 days. Traefik's access log, with the addresses of the site's
# visitors, is written here (stacks/edge.yml, "logging"), and the privacy notice names those 7 days
# („Zugriffsprotokoll" in folia/crates/home/src/i18n/legal.rs): change them together. journald
# deletes a whole file once its oldest entry is older than MaxRetentionSec, which it checks when it
# starts the next file; a file takes at most MaxFileSec of entries, so 6 + 1 days bound every entry
# at 7 days.
MaxRetentionSec=6day
MaxFileSec=1day

# By size, high enough that the age above decides (owner, 2026-11-19): Traefik writes nearly all of
# it, about 46,000 lines an hour on 2026-11-19, 1.7 GB of journal a day, so 7 days take 12 GB and
# 16 GB leave room for 30 % more. More traffic than that deletes the oldest files earlier, which the
# privacy notice allows (90-verify-host.sh journald warns). 500 MB held 7 hours. The disk has 387 GB.
SystemMaxUse=16G
SystemKeepFree=1G
# journald closes a file once its hash tables are three quarters full, and sizes them for
# SystemMaxFileSize: at 50M that was every 20 minutes, at 24 MB, and the default of at most 100
# files would have ended the journal after a day and a half. Sized for 128M (journald's own upper
# default), a file holds about an hour; 1000 of them leave SystemMaxUse the limit.
SystemMaxFileSize=128M
SystemMaxFiles=1000
Compress=yes
