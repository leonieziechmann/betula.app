# The networks of this host and who is on each of them: every service reaches what it needs and
# nothing else (owner, 2026-11-05: "jeder service [soll] auf exakt die elemente zugreifen [können],
# die benötigt werden und nichts mehr"). README.md section 15 has the matrix in words: who reaches
# whom on which port, and why. Read by vps/lib-networks.sh, for
#   vps/30-docker.sh        creates the networks marked "host" (and refuses one that differs)
#   vps/40, 48, 50 ...      refuse to deploy while a network they need is missing
#   vps/90-verify-host.sh   the networks of the host as planned
#   vps/91-verify-stacks.sh section netmatrix: each network has exactly these members, and the
#                           probes from every container: what shares a network connects, nothing
#                           else does (and nothing that is internal reaches the internet)
#   deploy/test/netmatrix.sh  the same in a local swarm, with stand-ins
# Not installed anywhere; plain words separated by blanks, "#" starts a comment.
#
#   net NAME BY INTERNAL ATTACHABLE SUBNET MEMBER...
#     BY          host: made by vps/30-docker.sh before any stack, which name it "external";
#                 stack: declared in a stack file and made by "docker stack deploy"
#     INTERNAL    yes: no way out of the host (no docker_gwbridge): nothing on it alone reaches
#                 the internet or an address of the host. no: its members get a way out
#     ATTACHABLE  yes: a container of "docker run --network NAME" may join it. Only cortex_seed
#                 (vps/cortex-seed.sh); every other network takes swarm services only
#     SUBNET      a fixed subnet; "-": one /24 out of the swarm's pool (vps/30-docker.sh)
#     MEMBER      the services on it, by their full names. "name?": only with an override
#                 (monitoring.public.yml, betula.egress.yml); "stack_*": every service of a stack
#                 ("stack_*?": every service of it that is on the network at all)
#   listen SERVICE PORT...   where a service accepts connections: the probes knock there
#   noout SERVICE...         a firewall of its own lets no new connection out of it: every probe
#                            from it fails, also to what shares a network with it
#   old NAME                 a network from before this plan (2026-11): it goes once nothing uses
#                            it any more (README.md section 15, "Moving to these networks")
#
# Docker networks have no direction: whoever shares one can open connections both ways. Where
# only one direction is needed, the other side holds nothing worth reaching (the scraper,
# monitoring_scraper, in front of Prometheus), refuses it itself (Traefik's metrics answer
# edge_metrics alone, config/traefik/dynamic/metrics.yml), or has a firewall of its own (Phloem:
# no new connection out, docs/phloem/protocol.md section 2).

# ---- Traefik and what it routes to: one network per site, nothing else on it
net edge_out           stack no  no  -             edge_traefik
net edge_socket        stack yes no  -             edge_traefik edge_socket-proxy
net edge_metrics       host  yes no  10.201.0.0/24 edge_traefik monitoring_scraper
net edge_placeholder   host  yes no  -             edge_traefik placeholder_web
net edge_grafana       host  yes no  -             edge_traefik monitoring_grafana?
net edge_betula        host  yes no  -             edge_traefik betula_folia
net edge_betula-green  host  yes no  -             edge_traefik betula-green_folia
net edge_canary        host  yes no  -             edge_traefik canary_folia
net edge_canary-green  host  yes no  -             edge_traefik canary-green_folia

# ---- Phloem, Betula Sync's service, as if it were an outside one (docs/phloem/protocol.md)
net phloem_in          host  yes no  -             edge_traefik phloem_*
net phloem-canary_in   host  yes no  -             edge_traefik phloem-canary_*
# <stack>_out: Phloem's way out, for TURN (step 2); in step 1 it may be missing altogether.
net phloem_out         stack no  no  -             phloem_*?
net phloem-canary_out  stack no  no  -             phloem-canary_*?

# ---- each instance of the application: Folia and its own Radix; that Radix and Cortex
net betula_snapshot         stack yes no  -        betula_radix betula_folia
net betula-green_snapshot   stack yes no  -        betula-green_radix betula-green_folia
net canary_snapshot         stack yes no  -        canary_radix canary_folia
net canary-green_snapshot   stack yes no  -        canary-green_radix canary-green_folia
net cortex_betula           host  yes no  -        betula_radix cortex_a cortex_b monitoring_scraper
net cortex_betula-green     host  yes no  -        betula-green_radix cortex_a cortex_b monitoring_scraper
net cortex_canary           host  yes no  -        canary_radix cortex_a cortex_b monitoring_scraper
net cortex_canary-green     host  yes no  -        canary-green_radix cortex_a cortex_b monitoring_scraper
net betula_egress           stack no  no  -        betula_radix?
net betula-green_egress     stack no  no  -        betula-green_radix?
net canary_egress           stack no  no  -        canary_radix?
net canary-green_egress     stack no  no  -        canary-green_radix?

# ---- Cortex: its way out, and the way of vps/cortex-seed.sh to it
net cortex_default     stack no  no  -             cortex_a cortex_b
net cortex_seed        stack yes yes -             cortex_a cortex_b

# ---- monitoring: Grafana asks, Alloy delivers, the scraper scrapes what lies outside the stack
net monitoring_query   stack yes no  -             monitoring_grafana monitoring_prometheus monitoring_loki
net monitoring_collect stack yes no  -             monitoring_alloy monitoring_prometheus monitoring_loki
net monitoring_relay   stack yes no  -             monitoring_scraper monitoring_prometheus
net monitoring_notify  stack no  no  -             monitoring_grafana

listen edge_traefik           8082 443 80
listen edge_socket-proxy      2375
listen placeholder_web        8080
listen betula_folia           8080
listen betula-green_folia     8080
listen canary_folia           8080
listen canary-green_folia     8080
listen betula_radix           8090
listen betula-green_radix     8090
listen canary_radix           8090
listen canary-green_radix     8090
listen cortex_a               8100
listen cortex_b               8100
listen monitoring_grafana     3000
listen monitoring_loki        3100
listen monitoring_prometheus  9090
listen monitoring_scraper     9090
listen monitoring_alloy       12345
listen phloem_*               8200
listen phloem-canary_*        8200

# "phloem start" sets the firewall of the container (phloem/deploy/firewall.nft) and drops its
# rights: no DNS, no new connection out, replies only.
noout phloem_* phloem-canary_*

old edge
old monitoring
old cortex
old monitoring_default
old betula_default
old betula-green_default
old canary_default
old canary-green_default
