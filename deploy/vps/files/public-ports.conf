# Ports that may be reached from the internet, besides SSH (22/tcp, handled separately).
# One source for three readers: 10-base.sh (ufw), betula-docker-firewall (forwarded traffic to
# containers) and 90-verify-host.sh. Installed as /etc/betula/public-ports.conf.
# Shell syntax, space separated. After a change: re-run 10-base.sh and 30-docker.sh.

PUBLIC_TCP_PORTS="80 443"

# Set to "443" only when Traefik serves HTTP/3 (QUIC); empty otherwise.
PUBLIC_UDP_PORTS=""

# Log packets that the Docker forward filter drops (rate limited, kernel log -> journal).
# Only ports that some container actually published can show up here, so this stays quiet.
LOG_BLOCKED="yes"
