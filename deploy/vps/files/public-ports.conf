# Ports that may be reached from the internet, besides SSH (22/tcp, handled separately).
# One source for four readers: 10-base.sh (ufw), betula-docker-firewall (forwarded traffic to
# containers), 90-verify-host.sh and 91-verify-stacks.sh. Installed as /etc/betula/public-ports.conf.
# Shell syntax, space separated; a range as first:last. After a change: re-run 10-base.sh and
# 30-docker.sh.
#
# Who publishes them (91-verify-stacks.sh ports: every one of them by exactly its service):
#   80/tcp, 443/tcp                  edge_traefik (and TURN over TLS on 443, by name: turn.<host>)
#   3478/tcp+udp, 49160:49223/udp    phloem_sync: STUN and TURN of betula.app, and its relays
#   3479/tcp+udp, 49224:49239/udp    phloem-canary_sync: the same for canary
# (stacks/phloem/<stack>.env, PHLOEM_TURN_PORT and PHLOEM_TURN_RELAY_PORTS: Betula Sync's step 2,
# docs/phloem/phloem.md, „TURN".)

PUBLIC_TCP_PORTS="80 443 3478 3479"

# 443 belongs here only when Traefik serves HTTP/3 (QUIC).
PUBLIC_UDP_PORTS="3478 3479 49160:49223 49224:49239"

# Log packets that the Docker forward filter drops (rate limited, kernel log -> journal).
# Only ports that some container actually published can show up here, so this stays quiet.
LOG_BLOCKED="yes"
