# Installed by /opt/betula/vps/10-base.sh as /etc/needrestart/conf.d/50-betula.conf (Perl syntax).

# Restart services that still run outdated libraries without asking: a security fix that waits
# for somebody to answer a dialog is not applied. Also keeps apt from blocking on a prompt.
$nrconf{restart} = 'a';

# Except the container runtime. Swarm forbids live-restore, so restarting dockerd restarts every
# container: that must be a decision (30-docker.sh, or the 04:30 reboot), not a side effect of a
# library update in the middle of the day.
$nrconf{override_rc}{qr(^docker)} = 0;
$nrconf{override_rc}{qr(^containerd)} = 0;

# Pending-kernel hints go to stderr instead of a dialog that would hang a non-interactive ssh.
$nrconf{kernelhints} = -1;
