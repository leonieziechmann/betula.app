# Installed by /opt/betula/vps/10-base.sh as /etc/rsyslog.d/10-betula-containers.conf.
#
# journald hands every entry to rsyslog (ForwardToSyslog=yes, /usr/lib/systemd/journald.conf.d/syslog.conf
# of the rsyslog package), and the stock rule "*.*;auth,authpriv.none -/var/log/syslog" (50-default.conf)
# copies it into /var/log/syslog, which logrotate keeps for the week it is written in and 4 more. Without
# this file that includes the lines of every container that logs through Docker's journald driver:
# Traefik's access log, with client addresses, URLs with their query strings and calendar codes
# (stacks/edge.yml, "privacy"). The privacy notice has them deleted after 7 days („Zugriffsprotokoll" in
# folia/crates/home/src/i18n/legal.rs): the journal (journald-betula.conf) and Loki keep them no longer,
# and rsyslog's files do not keep them at all (README.md section 9).
#
# One line per container on the journald driver, by its tag (the "tag" option under its "logging:" key,
# which becomes its syslog identifier); 90-verify-host.sh fails for a running container on that driver
# whose tag has no line here. "stop" ends the message's way through the rules, so no later file gets it;
# the journal keeps it. rsyslog reads /etc/rsyslog.d in name order (10- before 20-ufw.conf, 21-cloudinit.conf
# and 50-default.conf), and only when it starts: 10-base.sh restarts it.

if $programname == "edge_traefik" then stop
