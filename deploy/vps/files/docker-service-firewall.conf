# Installed by /opt/betula/vps/30-docker.sh as
# /etc/systemd/system/docker.service.d/10-betula-firewall.conf.
# A drop-in survives docker-ce package upgrades (they replace /usr/lib/systemd/system only).

[Unit]
# ufw loads its chains and the FORWARD policy first, then our filter, then dockerd adds its own.
After=ufw.service

[Service]
# Fail closed: when the filter cannot be installed, dockerd does not start and no container
# port is ever published unfiltered. See the script for the reasoning.
ExecStartPre=/usr/local/sbin/betula-docker-firewall
