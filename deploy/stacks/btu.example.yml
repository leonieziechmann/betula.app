# Stack "btu" - EXAMPLE. The application: the Go scraper (internal) and the Rust/Leptos web server,
# the only public service, at https://betula.app. Copy it to btu.yml, resolve the TODOs, then
# (as deploy, no sudo; details in README.md, "Shipping the application"):
#
#   export BTU_SCRAPER_IMAGE=btu-scraper:2026-09-20-ab12cd3  BTU_WEB_IMAGE=btu-server:2026-09-20-ab12cd3
#   docker stack deploy --resolve-image never --detach=false -c /opt/betula/stacks/btu.yml btu
#   docker stack rm placeholder            # once https://betula.app shows the application
#
# Not deployed by vps/40-stacks.sh: that script only stops deploying the placeholder once this
# stack exists.
#
# Images. There is no registry: an image arrives with "docker save | ssh ... docker load" and is
# named by a tag that is NEW for every build (date + git commit). Never ":latest" and never the
# same tag twice: swarm compares the service definition, not the image content, so a re-loaded
# "latest" would not restart anything. --resolve-image never: the default asks a registry for
# the digest of the tag, and there is no registry that knows these images.
#
# Names are part of the contract of the monitoring stack: the services must be called "scraper"
# and "web" (btu_scraper, btu_web in the alert rules betula-required-service-down and
# betula-service-down), and both must log JSON lines with level / event / msg on stdout or stderr
# (rule "btu: ERROR in the logs": level=ERROR means a human is needed, docs/operations.md section 2).
#
# What the facts below are based on: docs/operations.md (scraper), flake.nix (scraper image),
# server/src/config.rs and server/src/main.rs (web server), docs/frontend.md.

services:
  scraper:
    # flake.nix builds "btu-scraper:latest" (nix build .#container); re-tag it before shipping.
    image: "${BTU_SCRAPER_IMAGE:?set BTU_SCRAPER_IMAGE to the tag you loaded, for example btu-scraper:2026-09-20-ab12cd3}"
    # The image brings everything else: Entrypoint /bin/scraper run, BTU_ADDR=0.0.0.0:8090,
    # BTU_DB=/data/btu_scraper.db, BTU_SNAPSHOT_DIR=/data/snapshot, BTU_LOG_FORMAT=json,
    # TZ=Europe/Berlin (the off-peak crawl window 1-6 is local time), and
    # HEALTHCHECK "scraper healthcheck" (60 s interval, 120 s start period): swarm replaces a
    # container that turns unhealthy, so no healthcheck is declared here.
    environment:
      BTU_LOG_LEVEL: info
    secrets:
      # Found without configuration at /run/secrets/gemini-api-key (docs/operations.md section 3).
      # Only "scan-curriculum" needs it:  docker exec <container> /bin/scraper scan-curriculum ...
      # Rotation: create gemini-api-key-v2, then  - source: gemini-api-key-v2 / target: gemini-api-key
      - gemini-api-key
    volumes:
      # Working database, snapshots and the statutes directory. Worth a backup (README.md).
      - btu-data:/data
    networks:
      # default: the web server reaches http://scraper:8090/snapshot/catalog.db. Not "internal":
      #          the scraper has to reach the university's servers.
      # monitoring: for Prometheus, as soon as the scraper exposes metrics (see the commented job
      #          in config/monitoring/prometheus.yml). TODO: the scraper has no /metrics endpoint
      #          today (docs/operations.md lists /healthz and /status only) - keep or drop this network?
      default: {}
      monitoring: {}
    # No ports: nothing but Traefik publishes anything. /status for a human:
    #   ssh -L 8090:<address of the container on docker_gwbridge>:8090 betula   (same recipe as for Grafana, README.md)
    cap_drop: [ALL]
    stop_grace_period: 60s        # SIGTERM stops it cleanly; a build transaction takes about 20 s
    deploy:
      replicas: 1                 # one writer per database
      placement:
        constraints:
          - node.role == manager  # the volume lives on this node
      restart_policy:
        condition: any
        delay: 30s
      update_config:
        order: stop-first         # never two writers on the volume
        failure_action: rollback
        monitor: 150s             # longer than the healthcheck's start period
      rollback_config:
        order: stop-first
      resources:
        limits:
          cpus: "1.0"             # the build must not starve the web server; never above the host's 4 CPUs
          memory: 1G              # docs/operations.md
          pids: 256

  web:
    # TODO: this image does not exist yet (docs/frontend.md, phase 4: "Nix package and container").
    #       Questions for whoever builds it, because the values below depend on the answers:
    #       1. Where does the image put the browser bundle (site/pkg from scripts/build-client.sh)?
    #          BTU_SITE_ROOT below assumes /site.
    #       2. Which user runs the server? /data (the volume) must be writable for it; a fresh named
    #          volume belongs to root unless the image creates /data with another owner.
    #       3. Does the image get a HEALTHCHECK? See "healthcheck" below before choosing /healthz.
    image: "${BTU_WEB_IMAGE:?set BTU_WEB_IMAGE to the tag you loaded, for example btu-server:2026-09-20-ab12cd3}"
    environment:
      # server/src/config.rs: the default is 127.0.0.1:8080, which Traefik could not reach.
      BTU_WEB_ADDR: "0.0.0.0:8080"
      # The only interface between the two services (plain HTTP inside the stack network).
      BTU_SNAPSHOT_URL: "http://scraper:8090/snapshot/catalog.db"
      # Downloaded snapshots; on a volume, so a restart works while the scraper is down.
      BTU_WEB_DATA_DIR: /data
      BTU_SITE_ROOT: /site                  # TODO (1)
      # The default is "text"; the alert rules only understand JSON (tracing, flatten_event).
      BTU_LOG_FORMAT: json
      BTU_LOG_LEVEL: info
      # Rendered pages kept in memory; part of the memory limit below (default 128).
      BTU_HTML_CACHE_MB: "128"
    volumes:
      - btu-web-data:/data
    networks:
      default: {}
      edge: {}
    cap_drop: [ALL]
    stop_grace_period: 30s          # graceful shutdown on SIGTERM (server/src/main.rs)
    # healthcheck - TODO (3). Do NOT simply point it at /healthz: that endpoint answers 503 until the
    # first snapshot has been downloaded (a fresh scraper needs hours for its first export) and
    # again when the scraper was unreachable for 6 h (BTU_SNAPSHOT_STALE_AFTER). Swarm kills an
    # unhealthy task and Traefik stops routing to it, so the site would go down exactly when it
    # could still serve the last snapshot. A liveness probe (any cheap 200, e.g. /robots.txt) is
    # the right container healthcheck; /healthz belongs to an external uptime monitor. btu-server
    # has no "healthcheck" subcommand like the scraper, and a Nix image has neither curl nor wget:
    # which probe binary goes into the image?
    # healthcheck:
    #   test: ["CMD", "<probe>", "http://127.0.0.1:8080/robots.txt"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager    # the volume lives on this node
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        # stop-first costs a few seconds per update, but start-first would run two servers on one
        # data directory, and each removes the snapshot files it does not know (snapshot.rs,
        # remove_other_files). TODO: start-first once the data directory is per task or not shared.
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
      resources:
        limits:
          cpus: "1.0"
          # TODO: measure. Holds the HTML cache (128 MB), the open snapshot (SQLite, about 100 MB
          # on disk) and the gzip copy it prepares for /api/db.
          memory: 768M
          pids: 256
      labels:
        # Service labels (deploy.labels): the swarm provider does not read container labels.
        - "traefik.enable=true"
        - "traefik.swarm.network=edge"
        - "traefik.http.routers.btu-web.rule=Host(`betula.app`)"
        - "traefik.http.routers.btu-web.entrypoints=websecure"
        - "traefik.http.routers.btu-web.tls.certresolver=le"
        # secure-headers: HSTS and friends. Traefik's value replaces a header the server sets
        # itself (the server sends X-Frame-Options DENY, the middleware makes it SAMEORIGIN).
        # compress: text types only; /api/db and the assets arrive pre-compressed and pass through.
        # TODO (owner): add rate-limit@file (50 req/s, burst 100 per address) from day one?
        - "traefik.http.routers.btu-web.middlewares=secure-headers@file,compress@file"
        # Default priority (rule length) beats the placeholder's priority 1, so this router takes
        # over the moment it appears; both use the same stored certificate.
        - "traefik.http.services.btu-web.loadbalancer.server.port=8080"

networks:
  default:
    driver: overlay
  edge:
    external: true
  monitoring:
    external: true

volumes:
  btu-data: {}
  btu-web-data: {}

secrets:
  # Created once on the server; the value comes from stdin and is never echoed or put into argv:
  #   <password manager CLI> | ssh betula docker secret create gemini-api-key -
  gemini-api-key:
    external: true
