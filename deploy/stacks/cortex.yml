# Stack "cortex": Cortex, the cache between the application and the internet (docs/cortex/cortex.md).
# Infrastructure of the host, not of an instance: one Cortex for every instance and colour. Two
# instances of the same image, cortex_a and cortex_b, each with a volume of its own. One of them
# leads: it holds the flock on /lock/leader.lock, fetches upstream and writes; the other follows
# its journal, answers what it can from its copy and forwards the rest. The kernel releases the
# lock the moment the leader's process ends, and the follower leads within a moment. That works
# because the volume "lock" below is one volume on one host that both mount: the one-node swarm.
#
# Deployed by vps/48-cortex.sh (as deploy, no sudo), which deploy/ship-cortex.sh calls after it
# has built and loaded the image; never by vps/40-stacks.sh, and never by hand with "docker stack
# deploy", which would update both instances at once:
#
#   bash /opt/betula/vps/48-cortex.sh 2026-10-02-ab12cd3
#
# The first deploy starts both. An update goes one instance at a time, so that there is always a
# leader: the follower, then "cortex step-down" on the leader (the follower takes the lock over),
# then the other. To do that, 48-cortex.sh deploys each instance from this file without the other
# one's block, and the layout below is a contract for it: exactly the services "a" and "b", two
# spaces deep under "services:", with what they share in the x- blocks at the top level.
#
# Variables:
#   CORTEX_IMAGE   given per release: flake.nix builds "betula-cortex:latest" (nix build
#                  .#cortex-image), ship-cortex.sh gives it the tag and 48-cortex.sh hands it over,
#                  for example betula-cortex:2026-10-02-ab12cd3. Never ":latest": swarm compares the
#                  service definition, not the image content (stacks/betula.yml, "Images").
#   CORTEX_REV     set by 48-cortex.sh: the revision of this file (a checksum of what "docker stack
#                  config" makes of it), kept as a service label. An instance whose image and
#                  revision are the wanted ones is not touched.
#
# The messages of "${NAME:?message}" below contain no "-" on purpose (stacks/betula.yml says why).
#
# The host policy, config/cortex/hosts.json (bind-mounted as /etc/cortex, read-only; JSON has no
# comments, so they are here). Cortex looks at its modification time every 30 s and reads it
# again when it changed, so deploy/sync.sh is all a change needs. A broken file keeps the policy
# Cortex has (log event policy.invalid, WARN); 48-cortex.sh refuses one that is not a JSON object.
#   allow        the hosts Cortex fetches from: exact names, "*.suffix" or "*". "*": every public
#                host; what no client asks for is never fetched (Cortex is passive). Private,
#                loopback and link-local addresses are refused whatever a name resolves to.
#   user_agent   sent upstream when the client names none.
#   default      the floor of a host without an entry of its own, for all clients together: at most
#                "concurrency" requests at a time, "pause" (+-30 %) after each, "queue_wait" in the
#                queue before 429, "breaker_failures" failures in a row pause the host for
#                "breaker_pause", "timeout" for a whole request, "max_body" bytes (8 GiB), and
#                "max_age" (how old a stored answer may be in mode cache). Durations as in Go.
#   hosts        an entry overrides the fields of "default" it names. Matched exactly, then by the
#                longest "*.suffix". The entries also name the metrics (host label); every other
#                host is "other".
#     qis.b-tu.de, www.b-tu.de   the university: half a second between two requests, as Radix's crawl.
#     opus4.kobv.de              the statutes: 2 s apart, a month fresh, and only PDFs are stored
#                                (a bot protection page answers 502 wrong-type instead).
#     huggingface.co, cdn-lfs.huggingface.co   models (README.md section 13): two downloads at a time.
#   Unknown fields are an error: a misspelt setting does not go unnoticed.
#
# Networks. "cortex" (vps/30-docker.sh) is internal: the application and Prometheus reach
# http://cortex_a:8100 and http://cortex_b:8100 over it and nothing leaves the host that way.
# Radix's own networks are internal, so Cortex is its way to the internet (but for Gemini, which
# does not go through Cortex: stacks/betula.egress.yml). The stack's own "default" is not
# internal: it is Cortex's way out. No port is published; /status for a human, on the server:
#   docker exec "$(docker ps -q -f name=cortex_a | head -n 1)" /bin/cortex status
#
# Logs: JSON lines with level / event / msg (the image sets CORTEX_LOG_FORMAT=json), read by the
# monitoring stack; no "logging:" key, like the other stacks.

x-cortex: &cortex
  # The image brings the rest: Entrypoint /bin/cortex serve, user 10002 (/data and /lock belong to
  # it; a fresh volume takes the owner over), CORTEX_ADDR=0.0.0.0:8100, CORTEX_DATA=/data,
  # CORTEX_LOG_FORMAT=json, TZ=Europe/Berlin and HEALTHCHECK "cortex healthcheck" (/livez every
  # 10 s, 3 tries, 30 s start period), so no healthcheck is declared here.
  image: "${CORTEX_IMAGE:?CORTEX_IMAGE is not set}"
  # Nothing is written outside the volumes and /tmp.
  read_only: true
  cap_drop: [ALL]
  networks:
    cortex: {}
    default: {}
  # SIGTERM stops it; the lock it held goes to the other instance the moment the process ends.
  stop_grace_period: 30s
  deploy:
    replicas: 1                 # one process per volume
    placement:
      constraints:
        - node.role == manager  # the volumes live on this node, and the lock only works on one host
    restart_policy:
      condition: any
      delay: 5s
    update_config:
      order: stop-first         # never two processes on one volume
      failure_action: rollback
      monitor: 30s
    rollback_config:
      order: stop-first
    resources:
      limits:
        # I/O and network, little else (docs/cortex/cortex.md): bodies stream to disk, never into memory.
        cpus: "0.5"
        memory: 256M
        pids: 256
    labels:
      # A label of the service, not of its tasks: changing it restarts nothing.
      app.betula.cortex-rev: "${CORTEX_REV:-0}"

x-cortex-environment: &cortex-environment
  # The lock both instances campaign for (the volume "lock"); leader.json next to it says who leads.
  CORTEX_LOCK: /lock/leader.lock
  CORTEX_HOSTS_FILE: /etc/cortex/hosts.json
  CORTEX_LOG_LEVEL: info
  # SQLite's temporary files (big sorts, VACUUM) on the volume, not in the small /tmp below,
  # which counts towards the memory limit.
  SQLITE_TMPDIR: /data/tmp
  # Go's heap stays below the memory limit with room for the rest (SQLite's page cache, stacks).
  GOMEMLIMIT: 200MiB

services:
  a:
    <<: *cortex
    environment:
      <<: *cortex-environment
      CORTEX_INSTANCE: a
      # Where the other instance reaches this one: the follower's journal and forwarded requests.
      CORTEX_ADVERTISE_URL: "http://cortex_a:8100"
    volumes:
      # The index and the blobs of this instance; worth a backup (the follower is no backup: a
      # deletion replicates).
      - a-data:/data
      - lock:/lock
      - /opt/betula/config/cortex:/etc/cortex:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216

  b:
    <<: *cortex
    environment:
      <<: *cortex-environment
      CORTEX_INSTANCE: b
      CORTEX_ADVERTISE_URL: "http://cortex_b:8100"
    volumes:
      - b-data:/data
      - lock:/lock
      - /opt/betula/config/cortex:/etc/cortex:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216

networks:
  cortex:
    external: true
  default:
    driver: overlay

volumes:
  a-data: {}
  b-data: {}
  # Holds nothing but the lock file and leader.json: shared by both, the one thing they share.
  lock: {}
