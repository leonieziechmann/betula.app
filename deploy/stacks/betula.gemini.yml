# Optional override for stacks/betula.yml: gives Radix the Gemini API key.
#
# "scan-curriculum" needs the key, and "run" writes the summaries of the semantic search with it
# (docs/operations.md section 3); an instance starts without it, and its vectors are then computed
# from the modules' texts alone. vps/50-app.sh adds this file while the swarm secret gemini-api-key exists:
#
#   <password manager CLI> | ssh betula docker secret create gemini-api-key -
#   docker exec <radix container> /bin/radix scan-curriculum ...
#
# Rotation: create gemini-api-key-v2, then  - source: gemini-api-key-v2 / target: gemini-api-key

services:
  radix:
    secrets:
      # Found without configuration at /run/secrets/gemini-api-key.
      - gemini-api-key

secrets:
  gemini-api-key:
    external: true
