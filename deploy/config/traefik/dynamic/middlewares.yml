# Reusable middlewares, referenced from router labels as <name>@file.
# Traefik watches this directory and applies a change within seconds. Look at its log afterwards: a router
# that names a middleware which failed to load is not served at all.

http:
  middlewares:
    # For every public router. No Content-Security-Policy here: it depends on what a page loads, so each
    # application sends its own (Folia: folia/crates/server/src/csp.rs).
    secure-headers:
      headers:
        # One year. The .app TLD is HSTS-preloaded as a whole, so a long max-age can lock nobody out who is
        # not locked to HTTPS already. includeSubDomains: every betula.app host is served from here over TLS.
        # No preload token: the TLD entry covers it, and a token would be a promise for a separate listing.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        # SAMEORIGIN, not DENY: stops foreign sites from framing us, still lets the app embed its own
        # documents (PDF viewer). Stricter rules go into the app's CSP as frame-ancestors.
        customFrameOptionsValue: SAMEORIGIN
        # Other sites learn the origin, never the path or the query.
        referrerPolicy: strict-origin-when-cross-origin
        # No device access, but the camera for the site itself: Betula's scanner reads the code another
        # device shows to connect it (Betula Sync, folia/crates/profile/src/scan.rs; the picture stays in
        # the browser). Only long-established feature names: Chrome logs a console warning for every
        # name it does not know.
        permissionsPolicy: "accelerometer=(), camera=(self), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        # An empty value removes the header; backend names and versions are nobody's business.
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

    # Responses that already carry Content-Encoding pass through untouched, so an application may ship
    # pre-compressed assets and still use this (Folia sends its pages and files in brotli already).
    # Of the codings a client weighs the same, Traefik takes the one highest in this list: brotli
    # first, so that what it compresses itself goes out as brotli too, not as zstd, which browsers
    # name as well (Chrome sends "gzip, deflate, br, zstd").
    compress:
      compress:
        encodings:
          - br
          - zstd
          - gzip
        minResponseBodyBytes: 1024
        # An allow list: text-like types only. Binary downloads (the catalog snapshot is a SQLite file of
        # about 100 MB) would cost CPU on every request for little gain.
        includedContentTypes:
          - text/html
          - text/css
          - text/plain
          - text/javascript
          - text/xml
          - application/javascript
          - application/json
          - application/manifest+json
          - application/xml
          - application/wasm
          - image/svg+xml

    # Optional, per source address. That is the real client: Traefik's ports are published in host mode and
    # no proxy sits in front. For IPv6 only once docker_gwbridge has IPv6 (see "ipv6" in stacks/edge.yml):
    # before, docker-proxy relays every IPv6 connection from the bridge gateway's address, and all IPv6
    # visitors share ONE bucket.
    # Generous on purpose: the first load of a single-page app is a burst of requests. Excess requests get 429.
    rate-limit:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
        sourceCriterion:
          ipStrategy:
            # One customer owns a whole /64: count it as one client.
            ipv6Subnet: 64

    # Betula Sync's service, Phloem, at /sync/v1/ (docs/phloem/protocol.md), for its router. Per source
    # address, like rate-limit: 20 requests a second and bursts of 60. A device opens one WebSocket and
    # keeps it; what it pushes over it is one request for Traefik. The rest (a space, a pairing parcel)
    # is a handful of requests, so this only stops a flood, before it reaches Phloem, whose own limits
    # hold behind it (20 new spaces per address and hour, 50 pushes a second per space).
    sync-ratelimit:
      rateLimit:
        average: 20
        period: 1s
        burst: 60
        sourceCriterion:
          ipStrategy:
            ipv6Subnet: 64
