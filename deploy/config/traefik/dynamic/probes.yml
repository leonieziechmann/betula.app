        && !HeaderRegexp(`User-Agent`, `(?i)(bot|crawl|spider|slurp|preview|google|Nexus 5X Build/MMB29P|; wv\))`)
        && HeaderRegexp(`Sec-Ch-Ua`, `.`)
        && ((HeaderRegexp(`User-Agent`, `\(KHTML, like Gecko\) Chrome/89\.`) && !HeaderRegexp(`Sec-Ch-Ua`, `v="89"`))
        || (HeaderRegexp(`User-Agent`, `\(KHTML, like Gecko\) Chrome/90\.`) && !HeaderRegexp(`Sec-Ch-Ua`, `v="90"`))
