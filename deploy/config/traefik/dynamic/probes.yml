        || (HeaderRegexp(`User-Agent`, `\(KHTML, like Gecko\) Chrome/95\.`) && !HeaderRegexp(`Sec-Ch-Ua`, `v="95"`))
        || (HeaderRegexp(`User-Agent`, `\(KHTML, like Gecko\) Chrome/96\.`) && !HeaderRegexp(`Sec-Ch-Ua`, `v="96"`))
