<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Betula – bald verfügbar</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f4;
    --fg: #1b221e;
    --muted: #5b665f;
    --accent: #3d7a58;
    --rule: #dcdfd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111412;
      --fg: #e9edea;
      --muted: #98a39c;
      --accent: #82c59e;
      --rule: #29302b;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    width: 100%;
    max-width: 26rem;
    text-align: center;
  }
  svg {
    display: block;
    width: 2.75rem;
    height: 2.75rem;
    margin: 0 auto 1.25rem;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: 2.25rem;
    font-weight: 650;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  hr {
    width: 3rem;
    height: 1px;
    margin: 1.5rem auto;
    border: 0;
    background: var(--rule);
  }
  p { margin: 0; }
  .lead { font-size: 1.125rem; }
  .note { margin-top: 0.5rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M12 2.5C4.5 8.5 4.5 15.5 12 21.5C19.5 15.5 19.5 8.5 12 2.5Z"/>
    <path d="M12 8v13.5M12 12.5L8.75 10M12 16.5l3.25-2.5"/>
  </svg>
  <h1>Betula</h1>
  <hr>
  <p class="lead">Hier entsteht gerade etwas Neues.</p>
  <p class="note">Diese Seite ist bald verfügbar.</p>
</main>
</body>
</html>
