# Placeholder site behind Traefik. nginx runs as uid 101 on a read-only root filesystem,
# so the pid file and every temp path point into /tmp (a tmpfs).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Traefik already writes the access log (JSON, with the client address nginx never sees); here it
    # would mostly record the healthcheck.
    access_log    off;
    server_tokens off;
    sendfile      on;

    server {
        listen 8080;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        # All add_header lines stay at server level: one add_header inside a location would drop them there.
        # Robots: a header as well as the meta tag, and no robots.txt - a crawler that is forbidden to fetch
        # the page never sees "noindex".
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Revalidate every time, so no browser shows this page after the app has gone live.
        add_header Cache-Control "no-cache" always;
        # The page is one document with an inline stylesheet; the transport headers come from Traefik.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Browsers ask for it unprompted; keep the 404 out of the error statistics.
        location = /favicon.ico {
            return 204;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
