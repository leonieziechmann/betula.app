# Loki 3.7 - single binary, everything on the local volume /loki, except the recording rules
# (config/monitoring/loki-rules, mounted read-only at /etc/loki/rules).
# Key names checked against docs/sources/shared/configuration.md of v3.7.8.
# Apply changes with:  docker service update --force monitoring_loki

auth_enabled: false   # one tenant; nothing outside the stack network can reach port 3100

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  # "info" prints a line for every query; Grafana's alert rules run several per minute
  # and Alloy would ship all of them straight back into Loki.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      # Where the ruler reads its rules: <directory>/<tenant>/*.yml. See "ruler" below.
      rules_directory: /etc/loki/rules

schema_config:
  configs:
    # One period, so the date only has to lie before the first log line.
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_encoding: snappy      # cheaper on CPU than gzip; disk is not the bottleneck at this volume
  wal:
    # Default is 4GB - replaying the WAL after a crash would run into the 288M container limit.
    replay_memory_ceiling: 96MB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true     # without this, retention_period below is ignored
  retention_delete_delay: 2h
  retention_delete_worker_count: 20
  delete_request_store: filesystem   # mandatory as soon as retention is enabled

limits_config:
  retention_period: 720h      # 30 days
  # Traefik's access log is the only stream with the addresses and user agents of site
  # visitors (personal data; German audience). Raw addresses are kept 7 days - long enough to
  # look into abuse or an outage, the same as the host journal keeps its copy
  # (vps/files/journald-betula.conf), and the period the privacy notice of betula.app names
  # ("Zugriffsprotokoll" in folia/crates/app/src/i18n/legal.rs, in every language): change them together.
  # The 30 days are meant for application and host logs. Traefik's own messages share the
  # stream and go with it; a failing renewal is covered by the certificate alert. What the
  # ruler counts from the stream (see "ruler") are numbers only, without addresses.
  # (Minimum period per stream is 24h; the selector takes label matchers only.)
  retention_stream:
    - selector: '{service="edge_traefik"}'
      priority: 1
      period: 168h

  # Survive a burst (crash loop, stack trace storm, first start reading old container logs)
  # instead of answering 429 and making Alloy drop lines. Defaults are 4 / 6 / 3MB / 15MB.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 32MB
  max_line_size: 256KB
  max_line_size_truncate: true   # keep the head of an oversized line instead of rejecting it

  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_global_streams_per_user: 5000

  allow_structured_metadata: true
  # Loki reads level from JSON / logfmt lines (and from the "level" metadata Alloy sets on
  # journal entries) and stores it as detected_level. The dashboards filter on it.
  discover_log_levels: true
  # The streams already carry stack/service/container/unit; no synthetic service_name label.
  discover_service_name: []
  volume_enabled: true

  max_entries_limit_per_query: 5000
  max_query_series: 1000
  query_timeout: 1m

querier:
  max_concurrent: 4

# The ruler counts the visitors of betula.app from Traefik's access log every 5 minutes and every
# hour (config/monitoring/loki-rules) and writes the numbers to Prometheus, which keeps them like
# every metric (prometheus.yml). The dashboard "Visitors" only reads those; nothing in Grafana
# reads the access log for it. The rules run in this process, one query after the other. Tried
# with Loki 3.7.8 on a generated week of access log as large as this server's (2026-10-01; the old
# dashboard's queries took as long there as here, 2-10 s each): a 7-day rule takes about 6 s and
# Loki stays inside GOMEMLIMIT, where one load of the old dashboard took 48 s and timed out.
ruler:
  wal:
    dir: /loki/ruler-wal   # the default "ruler-wal" is relative to the working directory, not the volume
  remote_write:
    enabled: true
    clients:
      prometheus:
        url: http://monitoring_prometheus:9090/api/v1/write   # --web.enable-remote-write-receiver

# Small embedded caches: the defaults (100 MB each) do not fit the memory budget.
query_range:
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 32

analytics:
  reporting_enabled: false
