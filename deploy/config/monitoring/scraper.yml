# The scraper: Prometheus 3.13 in agent mode (stacks/monitoring.yml, service scraper). It scrapes
# what lies outside the monitoring stack and writes the samples to Prometheus, which is on no
# network outside the stack (vps/files/networks.conf). Checked against
# docs/configuration/configuration.md of v3.13.3 (agent mode: no rule_files, no alerting, no
# storage block; remote_write is required).
# Apply changes with:  docker service update --force monitoring_scraper
# (bash /opt/betula/vps/40-stacks.sh monitoring does it: the checksum of config/monitoring changes)
#
# The jobs keep their names, labels and targets from the time Prometheus scraped them itself, so
# the dashboards and the alert rules see the same series. up{job=...} reaches Prometheus as a
# sample like any other; while the scraper does not run, there is none (and up{job="scraper"},
# which Prometheus scrapes itself, is 0: rule "Monitoring target is down").

global:
  scrape_interval: 30s
  scrape_timeout: 10s

remote_write:
  # Over "relay" (the scraper and Prometheus). Prometheus accepts samples up to 10 minutes old
  # (out_of_order_time_window in prometheus.yml): what the write-ahead log replays after a restart.
  - url: http://monitoring_prometheus:9090/api/v1/write
    queue_config:
      max_shards: 2   # a few thousand series; the default of 50 only costs memory

scrape_configs:
  # Traefik's metrics entrypoint, over edge_metrics: Traefik and the scraper, a subnet of its own,
  # and the only subnet the entrypoint answers (config/traefik/dynamic/metrics.yml; every other
  # network Traefik is on gets 403). The target is simply down until the edge stack runs.
  - job_name: traefik
    static_configs:
      - targets: ["edge_traefik:8082"]

  # Radix, the collector, of every instance (stacks/betula.yml puts it on cortex_<instance>, with
  # Cortex and the scraper): GET /metrics, for the dashboard "Radix". Found by DNS, not listed:
  # tasks.<service> names the running task, and the name of an instance that does not run does not
  # resolve, so it is no target at all instead of a target that is down (rule "Monitoring target
  # is down").
  # A new instance file (stacks/<instance>.env) needs its line here, and its network cortex_<name>
  # (vps/files/networks.conf, stacks/monitoring.yml).
  # The names end with a dot. The container's resolv.conf says "search .", so a name without one
  # is also asked as "tasks.canary_radix..", which Docker's DNS answers with an error instead of
  # "no such name", and the targets found before are kept: a colour canary-agent.sh removed
  # stayed a target that is down, until a restart, and "Monitoring target is down" fired for it
  # (canary-green for two days, until 2026-10-04). Asked as they are, a name that does not resolve
  # is no target any more.
  - job_name: radix
    dns_sd_configs:
      - names:
          - tasks.betula_radix.
          - tasks.betula-green_radix.
          - tasks.canary_radix.
          - tasks.canary-green_radix.
        type: A
        port: 8090
        refresh_interval: 30s
    relabel_configs:
      # stack="betula-green", and the same as instance: the address changes with every task.
      - source_labels: [__meta_dns_name]
        regex: "tasks\\.(.+)_radix\\.?"
        target_label: stack
      - source_labels: [stack]
        target_label: instance

  # Cortex, the cache between the application and the internet (stacks/cortex.yml): both
  # instances over cortex_<instance>, for the dashboard "Cortex" and the alert group
  # betula-cortex. Listed, not found by DNS: there are always exactly these two, and one that does
  # not answer is a target that is down (rule "Monitoring target is down": the follower missing for
  # 5 minutes) rather than no target at all. On a host without Cortex both are always down; the
  # rules for job cortex therefore wait until it has answered once (and forget it 7 days after it
  # last did). The service name resolves to its virtual address, so the series stay the same when
  # a task is replaced.
  - job_name: cortex
    static_configs:
      - targets: ["cortex_a:8100", "cortex_b:8100"]
    relabel_configs:
      # instance="cortex_a": the name of the service, as docker service logs and the alerts say it.
      - source_labels: [__address__]
        regex: "(.+):8100"
        target_label: instance
