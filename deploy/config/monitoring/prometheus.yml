# Prometheus 3.13 - checked against docs/configuration/configuration.md of v3.13.3.
# Host and container metrics are NOT scraped here: Alloy collects them on the host and
# pushes them through remote write (jobs integrations/unix and integrations/cadvisor).
# Apply changes with:  docker service update --force monitoring_prometheus

global:
  scrape_interval: 30s
  scrape_timeout: 10s

storage:
  tsdb:
    # In 3.13 retention belongs here; the --storage.tsdb.retention.* flags are deprecated.
    retention:
      time: 15d
      size: 3GB        # cap: whichever limit is reached first wins
    # Alloy replays its write-ahead log after a restart; accept samples that arrive late
    # instead of rejecting them as out of order.
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Traefik's dedicated metrics entrypoint, reachable only over the external "monitoring"
  # overlay. The target is simply down until the edge stack runs.
  - job_name: traefik
    static_configs:
      - targets: ["edge_traefik:8082"]

  - job_name: loki
    static_configs:
      - targets: ["monitoring_loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["monitoring_grafana:3000"]

  - job_name: alloy
    static_configs:
      - targets: ["monitoring_alloy:12345"]

  # Radix, the collector, of every instance (stacks/betula.yml puts it on the internal "cortex"
  # network, and stacks/monitoring.yml Prometheus as well): GET /metrics, for the dashboard
  # "Radix". Found by DNS, not listed: tasks.<service> names the running task, and the name of an
  # instance that does not run does not resolve, so it is no target at all instead of a target
  # that is down (rule "Monitoring target is down").
  # A new instance file (stacks/<instance>.env) needs its line here.
  - job_name: radix
    dns_sd_configs:
      - names:
          - tasks.betula_radix
          - tasks.betula-green_radix
          - tasks.canary_radix
          - tasks.canary-green_radix
        type: A
        port: 8090
        refresh_interval: 30s
    relabel_configs:
      # stack="betula-green", and the same as instance: the address changes with every task.
      - source_labels: [__meta_dns_name]
        regex: "tasks\\.(.+)_radix"
        target_label: stack
      - source_labels: [stack]
        target_label: instance

  # Cortex, the cache between the application and the internet (stacks/cortex.yml): both
  # instances over the internal "cortex" network, for the dashboard "Cortex" and the alert group
  # betula-cortex. Listed, not found by DNS: there are always exactly these two, and one that does
  # not answer is a target that is down (rule "Monitoring target is down": the follower missing for
  # 5 minutes) rather than no target at all. On a host without Cortex both are always down; the
  # rules for job cortex therefore wait until it has answered once (and forget it 7 days after it
  # last did). The service name resolves to its virtual address, so the series stay the same when
  # a task is replaced.
  - job_name: cortex
    static_configs:
      - targets: ["cortex_a:8100", "cortex_b:8100"]
    relabel_configs:
      # instance="cortex_a": the name of the service, as docker service logs and the alerts say it.
      - source_labels: [__address__]
        regex: "(.+):8100"
        target_label: instance
