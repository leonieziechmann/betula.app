# Prometheus 3.13 - checked against docs/configuration/configuration.md of v3.13.3.
# Host and container metrics are NOT scraped here: Alloy collects them on the host and
# pushes them through remote write (jobs integrations/unix and integrations/cadvisor; Phloem's
# numbers, job phloem, and the guard's, job phloem-guard, the same way). Traefik, Radix and
# Cortex are scraped by the scraper, which writes them here (jobs traefik, radix, cortex).
# Apply changes with:  docker service update --force monitoring_prometheus

global:
  scrape_interval: 30s
  scrape_timeout: 10s

storage:
  tsdb:
    # In 3.13 retention belongs here; the --storage.tsdb.retention.* flags are deprecated.
    retention:
      time: 15d
      size: 3GB        # cap: whichever limit is reached first wins
    # Alloy replays its write-ahead log after a restart; accept samples that arrive late
    # instead of rejecting them as out of order.
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: loki
    static_configs:
      - targets: ["monitoring_loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["monitoring_grafana:3000"]

  - job_name: alloy
    static_configs:
      - targets: ["monitoring_alloy:12345"]

  # The scraper (config/monitoring/scraper.yml) writes what it scrapes outside this stack
  # (jobs traefik, radix and cortex) through remote write; Prometheus is on no network outside
  # the stack (vps/files/networks.conf). This is the scraper's own health: while it does not run,
  # those jobs have no samples at all, and this target is down.
  - job_name: scraper
    static_configs:
      - targets: ["monitoring_scraper:9090"]
