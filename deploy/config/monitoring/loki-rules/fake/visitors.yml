# Recording rules of Loki's ruler: what the dashboard "Visitors" shows, counted from Traefik's
# access log and stored in Prometheus (ruler.remote_write in loki.yml). The dashboard never reads
# the access log itself. Every number is a count; no address, user agent or calendar code
# leaves Loki, whose copy of the access log is gone after 7 days (loki.yml, retention_stream).
#
# The directory "fake" is the tenant: Loki runs with auth_enabled: false, and that tenant is
# called "fake". The ruler reads this directory every minute (ruler.poll_interval), so a change
# here takes effect without a restart of Loki.
#
# Every rule counts a window that is longer than the interval of its group, so that a count missed
# while Loki restarts leaves no hole: the dashboard takes the latest count of the last 10 minutes
# (the 7-day ones: of the last 3 hours). It reads the hourly windows once per hour (step 1h), which
# counts every app start once.
#
# A visitor is a browser that started the app: boot.js asks /api/status with cache: no-store on
# every start, returning visits too. A browser is its address + user agent. Left out: crawlers by
# user agent (Google's renderer sends a Nexus 5X agent without "bot") and by Google's addresses,
# and whatever the filter in front of the sites turned away (RouterName edge-crawlers@file by user
# agent, edge-crawler-fleets@file by the user agents of fleets that pass for browsers,
# edge-crawler-networks@file from the clouds whose crawlers pass for browsers,
# edge-outside-europe@file from outside Europe: config/traefik/dynamic/crawlers.yml, fleets.yml,
# crawler-networks.yml, europe.yml).
groups:
  - name: visitors-5m
    interval: 5m
    rules:
      # Visitors of the last hour, by device and browser (sum = all visitors).
      - record: betula:visitors:1h
        expr: |
          count by (device, browser) (sum by (device, browser, host, ua) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `"RequestPath":"/api/status"` !~ `"RouterName":"edge-(crawler|outside-europe)`
            | json host="ClientHost", ua=`["request_User-Agent"]`
            | ua!~`(?i).*(bot|crawl|spider|slurp|headless|lighthouse|preview|facebookexternalhit|curl|wget|python|go-http|java/|okhttp|scan|Nexus 5X Build/MMB29P).*`
            | ua!=`` | host!~`(66\.249|74\.125|192\.178)\..*`
            | label_format
                device=`{{ if or (contains "iPad" .ua) (and (contains "Android" .ua) (not (contains "Mobile" .ua))) }}Tablet{{ else if or (contains "Mobile" .ua) (contains "iPhone" .ua) }}Phone{{ else }}Desktop{{ end }}`,
                browser=`{{ if or (contains "Firefox/" .ua) (contains "FxiOS/" .ua) }}Firefox{{ else if or (contains "Edg/" .ua) (contains "EdgA/" .ua) (contains "EdgiOS/" .ua) }}Edge{{ else if or (contains "OPR/" .ua) (contains "OPiOS/" .ua) }}Opera{{ else if contains "SamsungBrowser/" .ua }}Samsung Internet{{ else if or (contains "Chrome/" .ua) (contains "CriOS/" .ua) }}Chrome{{ else if contains "Safari/" .ua }}Safari{{ else }}other{{ end }}`
            | keep host, ua, device, browser
            [1h])))

      # The same for the last 24 hours.
      - record: betula:visitors:24h
        expr: |
          count by (device, browser) (sum by (device, browser, host, ua) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `"RequestPath":"/api/status"` !~ `"RouterName":"edge-(crawler|outside-europe)`
            | json host="ClientHost", ua=`["request_User-Agent"]`
            | ua!~`(?i).*(bot|crawl|spider|slurp|headless|lighthouse|preview|facebookexternalhit|curl|wget|python|go-http|java/|okhttp|scan|Nexus 5X Build/MMB29P).*`
            | ua!=`` | host!~`(66\.249|74\.125|192\.178)\..*`
            | label_format
                device=`{{ if or (contains "iPad" .ua) (and (contains "Android" .ua) (not (contains "Mobile" .ua))) }}Tablet{{ else if or (contains "Mobile" .ua) (contains "iPhone" .ua) }}Phone{{ else }}Desktop{{ end }}`,
                browser=`{{ if or (contains "Firefox/" .ua) (contains "FxiOS/" .ua) }}Firefox{{ else if or (contains "Edg/" .ua) (contains "EdgA/" .ua) (contains "EdgiOS/" .ua) }}Edge{{ else if or (contains "OPR/" .ua) (contains "OPiOS/" .ua) }}Opera{{ else if contains "SamsungBrowser/" .ua }}Samsung Internet{{ else if or (contains "Chrome/" .ua) (contains "CriOS/" .ua) }}Chrome{{ else if contains "Safari/" .ua }}Safari{{ else }}other{{ end }}`
            | keep host, ua, device, browser
            [24h])))

      # App starts of the last hour, returning visits included.
      - record: betula:app_starts:1h
        expr: |
          sum(count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `"RequestPath":"/api/status"` !~ `"RouterName":"edge-(crawler|outside-europe)`
            | json host="ClientHost", ua=`["request_User-Agent"]`
            | ua!~`(?i).*(bot|crawl|spider|slurp|headless|lighthouse|preview|facebookexternalhit|curl|wget|python|go-http|java/|okhttp|scan|Nexus 5X Build/MMB29P).*`
            | ua!=`` | host!~`(66\.249|74\.125|192\.178)\..*`
            | drop host, ua
            [1h]))

      # Every request to betula.app of the last hour: who = crawlers turned away (403 from the
      # crawler filter, config/traefik/dynamic/crawlers.yml by user agent, crawler-networks.yml by
      # the network it comes from), outside Europe (403 of europe.yml), Google, other crawlers (the
      # other search engines and the link previews, which are served) or everything else (people,
      # scanners, tools); crawler = the crawler's name from its user agent (the word with
      # bot/crawl/spider), empty for everything else, turned away or not.
      - record: betula:requests:1h
        expr: |
          sum by (who, crawler) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"`
            | regexp `"request_User-Agent":"[^"]*?(?P<crawler>[A-Za-z0-9._-]*(?i:bot|crawl|spider)[A-Za-z0-9._-]*)`
            | json host="ClientHost", ua=`["request_User-Agent"]`, router="RouterName"
            | label_format crawler=`{{ if contains "Nexus 5X Build/MMB29P" .ua }}{{ if contains "Googlebot" .ua }}Googlebot{{ else if contains "GoogleOther" .ua }}GoogleOther{{ else }}Google renderer{{ end }}{{ else }}{{ .crawler }}{{ end }}`
            | label_format who=`{{ if hasPrefix "edge-crawler" .router }}crawlers turned away{{ else if eq .router "edge-outside-europe@file" }}outside Europe{{ else if or (contains "Google" .crawler) (hasPrefix "66.249." .host) }}Google{{ else if .crawler }}other crawlers{{ else }}everything else{{ end }}`
            | keep who, crawler
            [1h]))

      # The pass in front of the catalog (folia/crates/server/src/pass.rs, since Folia 1.107.0):
      # requests for the catalog (/api/db) and for the pass (/api/pass) of the last hour by what
      # they got. A browser's first visit is one refused (401, the challenge), one earned (204)
      # and one downloaded (200); a client that runs no script stays at refused.
      - record: betula:pass:1h
        expr: |
          sum by (result) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |~ `"RequestPath":"/api/(db|pass)"` !~ `"RouterName":"edge-(crawler|outside-europe)`
            | json path="RequestPath", status="DownstreamStatus"
            | label_format result=`{{ if eq .path "/api/pass" }}{{ if eq .status "204" }}pass earned{{ else }}solution refused{{ end }}{{ else if eq .status "401" }}catalog refused without a pass{{ else if eq .status "200" }}catalog downloaded{{ else if eq .status "304" }}catalog unchanged{{ else }}other{{ end }}`
            | keep result
            [1h]))

      # The same by address: how many addresses got each (an address that is refused and never
      # earns a pass ran no script).
      - record: betula:pass_addresses:1h
        expr: |
          count by (result) (sum by (result, host) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |~ `"RequestPath":"/api/(db|pass)"` !~ `"RouterName":"edge-(crawler|outside-europe)`
            | json host="ClientHost", path="RequestPath", status="DownstreamStatus"
            | label_format result=`{{ if eq .path "/api/pass" }}{{ if eq .status "204" }}pass earned{{ else }}solution refused{{ end }}{{ else if eq .status "401" }}catalog refused without a pass{{ else if eq .status "200" }}catalog downloaded{{ else if eq .status "304" }}catalog unchanged{{ else }}other{{ end }}`
            | keep result, host
            [1h])))

      # The traps (folia/crates/server/src/trap.rs, since Folia 1.109.0): what Folia itself answered
      # 429 in the last hour (OriginStatus; Traefik's own rate limit answers 429 without asking
      # Folia, and is not counted). A request for a trap, by its kind (the bait Betula lays under
      # /api/trap/, or what a scanner looks for: the patterns of security.yml), or a request for
      # anything else from an address that is paused.
      - record: betula:trap:1h
        expr: |
          sum by (result) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `"OriginStatus":429`
            | regexp `"RequestPath":"[^"]*?(?P<probe>/\.env|/\.git|/\.aws|/\.ssh|/\.vscode|\.DS_Store|/backup|\.sql|\.bak|/wp-|wordpress|/xmlrpc|\.php|phpmyadmin|/vendor/|\.\./|%2e%2e|/etc/passwd|/cgi-bin|/actuator|/server-status|/solr|/jenkins|/druid|/swagger|/HNAP1|/boaform)`
            | json path="RequestPath"
            | label_format result=`{{ if hasPrefix "/api/trap/" .path }}trap sprung: laid bait{{ else if .probe }}trap sprung: scanner probe{{ else }}turned away while paused{{ end }}`
            | keep result
            [1h]))

      # Pauses ended by the button of the page a paused address gets (POST /api/trap/release).
      - record: betula:trap_released:1h
        expr: |
          sum(count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `"RequestPath":"/api/trap/release"` |= `"RequestMethod":"POST"` |= `"OriginStatus":303`
            [1h]))

      # Addresses Folia turned away in the last hour: those that sprang a trap or were paused.
      - record: betula:trap_addresses:1h
        expr: |
          count(sum by (host) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `"OriginStatus":429`
            | json host="ClientHost"
            | keep host
            [1h])))

  - name: visitors-1h
    interval: 1h
    rules:
      # Visitors of the last 7 days (as long as Loki keeps the access log), by device and browser.
      - record: betula:visitors:7d
        expr: |
          count by (device, browser) (sum by (device, browser, host, ua) (count_over_time(
            {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `"RequestPath":"/api/status"` !~ `"RouterName":"edge-(crawler|outside-europe)`
            | json host="ClientHost", ua=`["request_User-Agent"]`
            | ua!~`(?i).*(bot|crawl|spider|slurp|headless|lighthouse|preview|facebookexternalhit|curl|wget|python|go-http|java/|okhttp|scan|Nexus 5X Build/MMB29P).*`
            | ua!=`` | host!~`(66\.249|74\.125|192\.178)\..*`
            | label_format
                device=`{{ if or (contains "iPad" .ua) (and (contains "Android" .ua) (not (contains "Mobile" .ua))) }}Tablet{{ else if or (contains "Mobile" .ua) (contains "iPhone" .ua) }}Phone{{ else }}Desktop{{ end }}`,
                browser=`{{ if or (contains "Firefox/" .ua) (contains "FxiOS/" .ua) }}Firefox{{ else if or (contains "Edg/" .ua) (contains "EdgA/" .ua) (contains "EdgiOS/" .ua) }}Edge{{ else if or (contains "OPR/" .ua) (contains "OPiOS/" .ua) }}Opera{{ else if contains "SamsungBrowser/" .ua }}Samsung Internet{{ else if or (contains "Chrome/" .ua) (contains "CriOS/" .ua) }}Chrome{{ else if contains "Safari/" .ua }}Safari{{ else }}other{{ end }}`
            | keep host, ua, device, browser
            [7d])))

      # Active calendar subscriptions: feed addresses (/calendar/<code>.ics) that a calendar
      # fetched at least twice in 7 days (not a single look at the address) and still within the
      # last 48 hours (not removed). The feeds ask for a refresh every 12 hours (catalog's ics.rs);
      # Google keeps its own pace, up to about a day. Counted per address, not per client: Google
      # fetches one subscription from many addresses. The .ics download is made in the browser and
      # never reaches the server.
      - record: betula:calendar_subscriptions:active
        expr: |
          count(
            (sum by (feed) (count_over_time(
              {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `/calendar/`
              | json path="RequestPath", status="DownstreamStatus", ua=`["request_User-Agent"]`
              | path=~`(/en)?/calendar/[^/?]+\.ics(\?.*)?` | status=~`2..|304` | ua!~`(?i).*(bot|crawl|spider).*`
              | label_format feed=`{{ regexReplaceAll "\\?.*$" .path "" }}`
              | keep feed
              [7d])) >= 2)
            and
            sum by (feed) (count_over_time(
              {service="edge_traefik"} |= `"RequestHost":"betula.app"` |= `/calendar/`
              | json path="RequestPath", status="DownstreamStatus", ua=`["request_User-Agent"]`
              | path=~`(/en)?/calendar/[^/?]+\.ics(\?.*)?` | status=~`2..|304` | ua!~`(?i).*(bot|crawl|spider).*`
              | label_format feed=`{{ regexReplaceAll "\\?.*$" .path "" }}`
              | keep feed
              [48h]))
          )
