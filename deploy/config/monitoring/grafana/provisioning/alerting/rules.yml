# Grafana-managed alert rules (unified alerting file provisioning, schema of Grafana 13.2).
# Every rule: A = instant query against a provisioned data source (uid prometheus / loki),
# B = reduce (last, NaN dropped), C = threshold. The numbers in the comments refer to the
# list in the monitoring task: (1) betula errors (2) containers (3) host (4) 5xx (5) certificate (6) ssh.
#
# State handling, decided once:
#   noDataState  OK       where "nothing found" is the healthy case (no error lines, no 5xx)
#                NoData   where data must always exist (host metrics, up)
#   execErrState KeepLast everywhere, so a restarting Loki/Prometheus does not flap every rule;
#                         betula-target-down is the exception that reports a broken backend.
#   severity     critical is repeated every 4 hours, warning once a day (policies.yml).
#   Firing rules are listed on top of the overview dashboard, with or without a working
#   notification channel.
#
# Annotations are Go templates and are NOT env-expanded by the provisioner; titles and labels
# are - keep "$" out of them. Provisioned rules are read-only in the UI: edit here, then
#   docker service update --force monitoring_grafana
# A rule removed from this file must be listed once under deleteRules (orgId, uid) to disappear.
apiVersion: 1

groups:
  - orgId: 1
    name: betula-logs
    folder: Betula alerts
    interval: "1m"
    rules:

      # (1) Radix's log levels are a contract: ERROR = a human is needed. One alert instance per
      # (service, event, msg), so the message names the event. The text is "msg" in Radix
      # (slog) and "message" in the Rust web server (tracing, flatten_event); label_format merges them.
      # Lines that are not JSON are skipped here (__error__) and handled by the next rule.
      # The web server has to log JSON (FOLIA_LOG_FORMAT=json; its image sets it, its default is text).
      # The stacks are the instances of the application (stacks/*.env): betula, and canary for the
      # closed test, each with its second colour <name>-green (blue-green), and cortex, the cache
      # between them and the internet (stacks/cortex.yml; its log has the same contract). A new
      # instance has to be named here and in rule (1b), or its errors stay silent.
      # The window is 35m = one Radix cycle (30m) + margin: an error that comes back every cycle is
      # ONE continuous alert instead of a resolve/fire pair every half hour. No data = no errors = OK.
      - uid: betula-error-logs
        title: "betula: ERROR in the logs"
        condition: C
        data:
          - refId: A
            queryType: instant
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: "sum by (service, event, msg) (count_over_time({stack=~\"(betula|canary)(-green)?|cortex\"} | json level=\"level\", event=\"event\", msg=\"msg\", message=\"message\" | __error__=\"\" | level=~\"ERROR|error|FATAL|fatal\" | label_format msg=`{{ if .msg }}{{ .msg }}{{ else }}{{ .message }}{{ end }}` [35m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "0s"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-logs
        panelId: 2
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: {{ if $labels.event }}{{ $labels.event }}{{ else }}ERROR{{ end }}"
          description: |-
            {{ $labels.msg }}
            {{ if eq $labels.event "validate.check_failed" }}An invariant or count baseline failed, so no new snapshot is published. A baseline below its minimum usually means a page layout changed and a parser no longer recognises a label. The fields check, value and samples of the log line say which one.{{ else if eq $labels.event "crawl.aborted" }}Ten pages failed in a row and the crawl stage stopped: the university server is down or blocks us. Published data is intact and only ages.{{ else if eq $labels.event "export.failed" }}The export failed; the previous snapshot stays current.{{ else if eq $labels.event "build.failed" }}The build was rolled back; the canonical data is unchanged.{{ else }}Level ERROR means a human is needed, or published data could not be updated (docs/radix/operations.md, section Logging).{{ end }}
            {{ if $values.B }}{{ printf "%.0f" $values.B.Value }} such line(s) in the last 35 minutes. {{ end }}Logs dashboard: the stack of {{ $labels.service }}, level error. Also: GET /status on Radix.

      # (1b) What rule (1) cannot parse: a Go runtime crash ("panic:", "fatal error:") or a Rust panic
      # on stderr, and ERROR lines of a web server that was deployed without FOLIA_LOG_FORMAT=json.
      # One crash stays below the restart rule's threshold, so this is the only signal for it.
      # Matched on the text, not on Loki's detected_level: that heuristic calls a line "info" as
      # soon as the word appears anywhere in it. No word boundaries: the text format wraps the
      # level in ANSI colour codes.
      - uid: betula-unstructured-errors
        title: "betula: crash or ERROR outside the JSON log"
        condition: C
        data:
          - refId: A
            queryType: instant
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: "sum by (service) (count_over_time({stack=~\"(betula|canary)(-green)?|cortex\"} !~ `^\\s*\\{` |~ `ERROR|FATAL|^panic: |^fatal error: |panicked at ` [35m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "0s"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-logs
        panelId: 2
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: crash or ERROR line that is not JSON"
          description: "{{ if $values.B }}{{ printf \"%.0f\" $values.B.Value }}{{ else }}Some{{ end }} line(s) in the last 35 minutes. Either the process crashed (Go \"panic:\" / \"fatal error:\", Rust \"panicked at\"; Swarm has restarted it) or the service logs text instead of JSON - the web server needs FOLIA_LOG_FORMAT=json (its image sets it), otherwise its errors arrive here without event and message. Logs dashboard: the stack of {{ $labels.service }}, filter panic|fatal error|ERROR."

      # The log rules treat "no data" as "all good", so a broken pipeline must raise its own alert.
      # Measured on Alloy's counters, not on log volume: a quiet night is not an outage.
      - uid: betula-log-shipping
        title: Logs are not reaching Loki
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "sum(rate({__name__=~\"loki_write_dropped_entries_total|loki_write_batch_retries_total\"}[10m]))"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "10m"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 40
        labels:
          severity: critical
        annotations:
          summary: Alloy cannot deliver logs to Loki
          description: "Alloy has been retrying or dropping log batches for 10 minutes. While this lasts, the log based alerts see nothing. Check: docker service logs monitoring_loki / monitoring_alloy, disk space, Loki's ingestion limits in loki.yml."

      # (1c) Canary follows master (vps/canary-agent.sh, run by betula-canary.service): a build of
      # master that does not reach canary. Its scripts log "FATAL" when they give up (lib.sh die),
      # the agent's own and the ones it runs (45-seed, 50-app, 55-switch). Canary then stays on the
      # release it had; the agent tries a release three times, 10 and 20 minutes apart, so a failing
      # build keeps this firing for about an hour. A warning: canary may be down for a while.
      - uid: betula-canary-deploy-failed
        title: "canary: a build of master did not reach canary"
        condition: C
        data:
          - refId: A
            queryType: instant
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: "sum(count_over_time({job=\"journal\", unit=\"betula-canary.service\"} |= `FATAL` [30m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "0s"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-logs
        panelId: 2
        labels:
          severity: warning
        annotations:
          summary: "canary: the automatic deploy of a build of master failed"
          description: "journalctl -u betula-canary.service -n 100 says which step (the FATAL line): the download from GitHub (401: the token has expired, README.md section 12), the copy of the public site's database, the build or validation of the new release on that data (50-app.sh), or the switch (55-switch.sh). Canary keeps the release it had. What runs and what failed: bash /opt/betula/vps/canary-agent.sh status."
  - orgId: 1
    name: betula-containers
    folder: Betula alerts
    interval: "1m"
    rules:

      # (2a) In Swarm a restart is a NEW container, so restarts are counted as containers of one service
      # started within 15 minutes. 3 or more: a rolling update starts one (two with a second replica).
      - uid: betula-restart-loop
        title: Container is restarting repeatedly
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "count by (stack, service) (max_over_time(container_start_time_seconds{service!=\"\"}[15m]) > (time() - 900))"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "0s"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 20
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} keeps restarting"
          description: "{{ if $values.B }}{{ printf \"%.0f\" $values.B.Value }}{{ else }}Several{{ end }} containers of {{ $labels.service }} were started within 15 minutes. Swarm restarts a task that exits or turns unhealthy. Check: docker service ps --no-trunc {{ $labels.service }} and the Logs dashboard."

      # (2b) cAdvisor knows containers, not Swarm's desired state, so "should run" has to be written
      # down. This rule names the services the site cannot live without and can therefore never
      # resolve by itself while one of them is gone (a task that cannot start - rejected, bad image,
      # missing secret - makes Traefik answer 404, which the 5xx rule does not see):
      #   edge_traefik   always
      #   the web server betula_folia, or placeholder_web while the application has not landed
      #   betula_radix    as soon as anything of stack betula runs (so the rule is quiet before betula lands)
      # absent() yields exactly one series per missing service. Keep the list in step with the
      # exclusion in (2c) when the betula stack names its services differently. 3m pending covers a
      # stop-first update. The last line keeps the rule quiet while cAdvisor itself reports nothing
      # (Alloy down is the target-down rule's job). During the very first bring-up it fires until
      # the edge and placeholder stacks run - that is the truth, not noise.
      - uid: betula-required-service-down
        title: A required service is not running
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "(absent(container_last_seen{service=\"edge_traefik\"}) or label_replace(absent(container_last_seen{service=~\"betula_folia|placeholder_web\"}), \"service\", \"betula_folia\", \"\", \"\") or (absent(container_last_seen{service=\"betula_radix\"}) and on() (count(container_last_seen{stack=\"betula\"}) > 0))) and on() (count(container_last_seen{id=\"/\"}) > 0)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "3m"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 20
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is not running"
          description: "No container of {{ $labels.service }} exists{{ if eq $labels.service \"betula_folia\" }} (and none of placeholder_web either): https://betula.app answers 404 or not at all{{ end }}. This alert stays until a container runs again. Check: docker service ps --no-trunc {{ $labels.service }} (a rejected task names its reason in the ERROR column), docker stack services {{ if eq $labels.service \"edge_traefik\" }}edge{{ else }}betula{{ end }}. If EVERY service is listed, cAdvisor inside Alloy has lost sight of Docker - check docker service logs monitoring_alloy."

  - orgId: 1
    name: betula-containers-slow
    folder: Betula alerts
    interval: "5m"   # the 7-day range query below is not worth running every minute
    rules:

      # (2c) The catch-all for every other service: had a container within the last 7 days, has none
      # now. It also catches a task that dies before the first scrape, which (2a) cannot see. A
      # deliberate removal (docker stack rm) looks the same: silence it, do not wait for it. Only a
      # warning (daily reminder): what the site needs is in (2b), and excluded here so it does not
      # alert twice.
      # Not cortex_a and cortex_b either: Prometheus scrapes both by name (job cortex), so a missing
      # one is "Monitoring target is down" (critical, 5 minutes) and, when no instance leads any
      # more, "Cortex has no leader, or two" - a third alert here would only repeat them.
      # Except blue-green, which removes a colour on purpose after a switch (deploy/README.md
      # section 4): <name> and <name>-green are two colours of one site (label "site" below: the
      # stack without "-green"), and a stack of which no container runs while another colour of
      # its site runs counts as retired and is left out. A service missing from a stack that still
      # runs is reported as before, and so is every service of both colours when neither runs. The
      # price: a colour that fails as a whole while the other one runs passes for retired as well;
      # Traefik then sends the site to the other one.
      - uid: betula-service-down
        title: Service has no running container
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "((count by (stack, service) (count_over_time(container_last_seen{service!=\"\", service!~\"edge_traefik|betula_folia|placeholder_web|betula_radix|cortex_a|cortex_b\"}[7d])) unless count by (stack, service) (container_last_seen{service!=\"\"})) unless on(stack) (label_replace(count by (stack) (count_over_time(container_last_seen{stack!=\"\"}[7d])) unless count by (stack) (container_last_seen{stack!=\"\"}), \"site\", \"$1\", \"stack\", \"(.+?)(-green)?\") and on(site) label_replace(count by (stack) (container_last_seen{stack!=\"\"}), \"site\", \"$1\", \"stack\", \"(.+?)(-green)?\"))) and on() (count(container_last_seen{id=\"/\"}) > 0)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "5m"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 20
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is not running"
          description: "{{ $labels.service }} had a container within the last 7 days and has none now. Check: docker service ps --no-trunc {{ $labels.service }}. If the service was removed on purpose, add a silence (Alerting > Silences, matcher service={{ $labels.service }}, 7 days): the rule only forgets a service after 7 days, and a \"resolved\" message then does NOT mean it is back. (A blue-green colour removed while the other colour runs is not reported in the first place.) If EVERY service is listed, cAdvisor inside Alloy has lost sight of Docker - check docker service logs monitoring_alloy."
  - orgId: 1
    name: betula-host
    folder: Betula alerts
    interval: "1m"
    rules:

      # (3) No data here means the host metrics are gone - that must not pass as healthy.
      - uid: betula-disk-usage
        title: "Disk usage above 85 %"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "100 * (1 - node_filesystem_avail_bytes{fstype=~\"ext[234]|xfs|btrfs\"} / node_filesystem_size_bytes{fstype=~\"ext[234]|xfs|btrfs\"})"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "10m"
        noDataState: NoData
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 12
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} is {{ if $values.B }}{{ printf \"%.0f\" $values.B.Value }} %{{ else }}almost{{ end }} full"
          description: "Usual suspects: docker system df (old images: docker image prune -a), journalctl --disk-usage, the volumes of Loki (30 d retention), Prometheus (3 GB cap) and Radix database."
      - uid: betula-memory-usage
        title: "Memory usage above 90 %"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "10m"
        noDataState: NoData
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 11
        labels:
          severity: critical
        annotations:
          summary: "Host memory is {{ if $values.B }}{{ printf \"%.0f\" $values.B.Value }} %{{ else }}almost{{ end }} used"
          description: "Based on MemAvailable, so page cache does not count. The overview dashboard shows memory per service; every service has a limit, so look for one that sits at its limit."

      # Swarm cannot run Alloy privileged, so cAdvisor has no /dev/kmsg and reports no OOM events.
      # The kernel writes the same fact into the journal.
      - uid: betula-oom-kill
        title: The kernel killed a process (out of memory)
        condition: C
        data:
          - refId: A
            queryType: instant
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: "sum(count_over_time({job=\"journal\"} |~ `[Oo]ut of memory: Killed process` [15m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "0s"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-logs
        panelId: 2
        labels:
          severity: critical
        annotations:
          summary: Out-of-memory kill on the host
          description: "The kernel log names the victim. \"Memory cgroup out of memory\" means a container hit its memory limit (raise the limit in the stack file or find the leak); without \"cgroup\" the whole host ran out. Logs dashboard: source journal, filter \"Killed process\"."
  - orgId: 1
    name: betula-edge
    folder: Betula alerts
    interval: "1m"
    rules:

      # (4) Only with at least 0.05 requests/s (15 in 5 minutes): one failed request out of three at
      # night is not an outage. No traffic or no 5xx at all = no data = OK.
      - uid: betula-traefik-5xx
        title: "Traefik answers more than 5 % of the requests with 5xx"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "100 * (sum(rate(traefik_entrypoint_requests_total{entrypoint=\"websecure\", code=~\"5..\"}[5m])) / sum(rate(traefik_entrypoint_requests_total{entrypoint=\"websecure\"}[5m]))) and on() (sum(rate(traefik_entrypoint_requests_total{entrypoint=\"websecure\"}[5m])) > 0.05)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "5m"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 31
        labels:
          severity: critical
        annotations:
          summary: "{{ if $values.B }}{{ printf \"%.1f\" $values.B.Value }} %{{ else }}Many{{ end }} of the HTTPS requests fail with 5xx"
          description: "502/504 usually mean the web service behind Traefik is down or restarting, 500 comes from the application itself. Traefik's access log has the details (kept for 7 days): Logs dashboard, service edge_traefik, text filter \"DownstreamStatus\":5 (type it with the quotes)."

      # (5) No certificate yet (edge not deployed, DNS missing) is no data = OK; Traefik being down is the target-down rule.
      # max by (sans), not min: Traefik never drops the series of a certificate it has replaced
      # (labels cn, serial, sans; traefik/traefik#8606, open), so after every renewal the old serial
      # lives on until Traefik restarts and min() would raise a false alarm 16 days later. The newest
      # certificate per name is the one being served; when a renewal really fails, the old one is
      # the newest and the rule fires as it should. sans is always filled, cn may be empty.
      - uid: betula-cert-expiry
        title: TLS certificate expires in less than 14 days
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "(max by (sans) (traefik_tls_certs_not_after{cn!=\"TRAEFIK DEFAULT CERT\"}) - time()) / 86400"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [14]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "1h"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-overview
        panelId: 4
        labels:
          severity: critical
        annotations:
          summary: "Certificate for {{ $labels.sans }} expires in {{ if $values.B }}{{ printf \"%.0f\" $values.B.Value }}{{ else }}a few{{ end }} days"
          description: "Traefik renews Let's Encrypt certificates 30 days before they expire, so renewal has been failing for a while. Check docker service logs edge_traefik for \"acme\", that port 80 is reachable (HTTP-01 challenge) and that the DNS record still points to this server. If this host name is no longer served at all (router removed), the entry is a leftover that disappears when Traefik restarts: docker service update --force edge_traefik."
  - orgId: 1
    name: betula-security
    folder: Betula alerts
    interval: "1m"
    rules:

      # (6) Failed logins and fail2ban bans are the permanent background noise of port 22 and say nothing.
      # (Measured: 7 failed password attempts in the first 22 minutes of this server's life.)
      # A SUCCESSFUL login that is not the deploy key never happens in normal operation: zero noise,
      # and the one event worth waking up for. The only expected firing: the operator's last root
      # login (ssh alias betula-root) less than 15 minutes before this stack first starts, because
      # Alloy reads the journal of the last 12 hours.
      # unit: sshd logs "Accepted ..." while the process still belongs to ssh.service; "session.*"
      # (Alloy folds session-<n>.scope into session.scope) is there in case journald attributes a
      # line to the login session that pam_systemd opens right afterwards.
      - uid: betula-ssh-unexpected-login
        title: SSH login that is not the deploy key
        condition: C
        data:
          - refId: A
            queryType: instant
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: "sum(count_over_time({job=\"journal\", unit=~\"ssh.*|session.*\"} |~ `Accepted \\S+ for ` !~ `Accepted publickey for deploy ` [15m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "0s"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-logs
        panelId: 2
        labels:
          severity: critical
        annotations:
          summary: Unexpected successful SSH login
          description: "sshd accepted a login that is not \"publickey for deploy\": a password login, root, or another user. After the hardening none of these can happen. Logs dashboard: source journal, filter \"Accepted\". Then: last -a, and check /etc/ssh/sshd_config.d/."
      - uid: betula-security-service-failed
        title: A security relevant service failed
        condition: C
        data:
          - refId: A
            queryType: instant
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: "sum(count_over_time({job=\"journal\"} |~ `(ssh|fail2ban|ufw|docker|containerd)\\.service: Failed with result` [30m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "0s"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-logs
        panelId: 2
        labels:
          severity: critical
        annotations:
          summary: "systemd reports a failed unit: ssh, fail2ban, ufw, docker or containerd"
          description: "Check systemctl --failed and journalctl -u <unit>. Without fail2ban or ufw the host is still key-only, but no longer protected as designed."
  - orgId: 1
    name: betula-cortex
    folder: Betula alerts
    interval: "1m"
    rules:

      # Cortex (stacks/cortex.yml): two instances, of which exactly one leads; the other takes the
      # lock over the moment the leader's process ends. No leader, or two, for a minute is
      # therefore never a takeover in progress (Prometheus scrapes the two at different moments,
      # so around a takeover one evaluation may count both or neither). A returns the number of
      # leaders only when it is not 1, so no data is the healthy case and C fires on any value it
      # returns. An instance that cannot be scraped counts as not leading, and so does a missing
      # job cortex.
      # All three rules of this group apply only to a Cortex that has answered a scrape within the
      # last 7 days (max_over_time of up; two series, cheap enough for every minute), the way
      # "Service has no running container" forgets a service after 7 days: on a host without
      # Cortex (not deployed yet, or retired) both static targets are always down, and a Radix
      # that crawls fetches directly instead (vps/50-app.sh), which is no reason to page anybody
      # every 4 hours. "Monitoring target is down" takes the same gate for job cortex. The price:
      # a first deploy whose Cortex never answers stays quiet here (vps/48-cortex.sh fails and says
      # why), and so does one that has been down for more than 7 days (91-verify-stacks.sh,
      # sections cortex and prometheus, still FAILs it while the stack exists).
      - uid: betula-cortex-leader
        title: "Cortex has no leader, or two"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "((sum(cortex_role{job=\"cortex\"}) or on() vector(0)) != 1) and on() (max(max_over_time(up{job=\"cortex\"}[7d])) > 0)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [-1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "1m"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-cortex
        panelId: 3
        labels:
          severity: critical
        annotations:
          summary: "Cortex: {{ if $values.B }}{{ printf \"%.0f\" $values.B.Value }}{{ else }}not one{{ end }} instance(s) lead"
          description: "Exactly one of cortex_a and cortex_b has to lead: it holds the lock, fetches and writes; the other follows its journal. None: what needs a fetch or a write is answered 503 no-leader, so the crawl of Radix fails, while the follower still serves what it has. Two: they do not share the lock (both have to mount the volume cortex_lock at /lock) and write apart. What each says: docker exec <its container> /bin/cortex status, for cortex_a and cortex_b; their logs: docker service logs cortex_a / cortex_b (leader.acquired, leader.stepped_down). An instance Prometheus cannot scrape counts as not leading: see the rule Monitoring target is down. Dashboard Cortex; bash /opt/betula/vps/91-verify-stacks.sh cortex."

      # The follower's distance: the age of the oldest entry of the leader's journal it has not
      # applied (0 on the leader, and on a follower that has caught up). Owner decision
      # (2026-10-02): asynchronous, losing the last 5 minutes is acceptable; alert beyond that.
      # Gated like the leader rule, so that the group as a whole is quiet on a host without Cortex.
      - uid: betula-cortex-replication-lag
        title: "Cortex: the follower is more than 5 minutes behind"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "max by (instance) (cortex_replication_lag_seconds{job=\"cortex\"}) and on() (max(max_over_time(up{job=\"cortex\"}[7d])) > 0)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [300]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "5m"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-cortex
        panelId: 15
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is {{ if $values.B }}{{ printf \"%.0f\" $values.B.Value }} s{{ else }}minutes{{ end }} behind the leader"
          description: "Replication is asynchronous (owner, 2026-10-02: the last minutes before a crash may be lost, not more): what the follower has not applied when it takes over is lost (the old leader drops it when it follows again, replica.diverged). The follower's /healthz turns unhealthy beyond 5 minutes. Usual causes: it cannot reach the leader (replica.failed in its log), it fetches the blobs of a big change, or it starts again from a snapshot (replica.snapshot). Check: docker exec <container of {{ $labels.instance }}> /bin/cortex status (follower.state), docker service logs {{ $labels.instance }}. Dashboard Cortex, row Replication."

      # The floor Cortex keeps per host, for all its clients together (config/cortex/hosts.json):
      # the breaker, or the host's own Retry-After, pauses a host. Short pauses are part of being
      # polite; one that lasts means the host is down or turns us away. Gated like the leader rule.
      - uid: betula-cortex-host-paused
        title: "Cortex has paused a host"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "max by (host) (cortex_host_paused{job=\"cortex\"}) and on() (max(max_over_time(up{job=\"cortex\"}[7d])) > 0)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "5m"
        noDataState: OK
        execErrState: KeepLast
        dashboardUid: betula-cortex
        panelId: 21
        labels:
          severity: warning
        annotations:
          summary: "Cortex sends nothing to {{ $labels.host }}"
          description: "Cortex has paused {{ $labels.host }} for more than 5 minutes: its breaker opened after breaker_failures failures in a row (network errors, timeouts, 5xx; then breaker_pause, 15 minutes by default), or the host answered 429 or 503 with Retry-After (at most an hour). Meanwhile a request for it gets the stored answer where one exists and the client allows it (stale=if-error), else 503 host-paused - Radix asks with stale=never, so its crawl of that host fails. If it lasts: is the host down, or does it block us? The leader's log: host.paused, upstream.failed; the settings: config/cortex/hosts.json (host other stands for every host without an entry there). Dashboard Cortex, row Hosts."
  - orgId: 1
    name: betula-meta
    folder: Betula alerts
    interval: "1m"
    rules:

      # The watchdog of the other rules. They keep their last state when a query fails (no flapping
      # while Loki or Prometheus restart); THIS rule turns to Error / NoData instead, so a dead
      # Prometheus is reported. Loki down shows up here as job="loki".
      # What nothing on this server can report: the server itself being down. Use an external
      # uptime check on https://betula.app for that.
      # Job cortex only while Cortex has answered a scrape within the last 7 days (group
      # betula-cortex says why): its two targets are listed, so on a host without Cortex they are
      # always down.
      - uid: betula-target-down
        title: Monitoring target is down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "up{job!=\"cortex\"} or (up{job=\"cortex\"} and on() (max(max_over_time(up{job=\"cortex\"}[7d])) > 0))"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
        for: "5m"
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} cannot be scraped"
          description: "Prometheus has not been able to scrape {{ $labels.job }} ({{ $labels.instance }}) for 5 minutes. traefik: is the edge stack running and attached to the monitoring network? cortex: does the instance run (docker stack services cortex), and is Prometheus on the network cortex? integrations/unix or integrations/cadvisor: Alloy. Check docker stack services monitoring."

# Rules this file provisioned once and no longer defines (see the header). Grafana deletes them on
# every provisioning run; a uid that is already gone is a no-op there, so an entry may stay.
# orgId is the first key of an entry: 91-verify-stacks.sh counts the lines "- uid: " as defined rules.
#   betula-btu-error-logs, betula-btu-unstructured-errors: queried {stack="btu"}; renamed to
#   betula-error-logs and betula-unstructured-errors in b391757 (2026-09-20).
deleteRules:
  - orgId: 1
    uid: betula-btu-error-logs
  - orgId: 1
    uid: betula-btu-unstructured-errors
